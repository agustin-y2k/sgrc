# Plantilla pública. `make local-init` crea docker-compose.local.yml.
# Se aplica explícitamente con --env-file .env.local y -p sgrc-local.
# No monta respaldos, inventario ni carpetas de una instalación particular.
services:
  sgrc-app:
    ports: ["127.0.0.1:8080:8080"]
  frontend:
    ports: ["127.0.0.1:8081:80"]
  postgres:
    ports: ["127.0.0.1:15432:5432"]
  grafana:
    ports: !override ["127.0.0.1:13000:3000"]
  prometheus:
    ports: ["127.0.0.1:19090:9090"]
  dozzle:
    ports: !override ["127.0.0.1:18888:8080"]
    environment:
      DOZZLE_FILTER: label=com.docker.compose.project=sgrc-local
networks:
  sgrc-net:
    ipam:
      config: !override
        - subnet: 172.30.70.0/24
