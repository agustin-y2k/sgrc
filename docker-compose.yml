services:
  sgrc-app:
    build: .
    mem_limit: 256m
    depends_on:
      postgres:
        condition: service_healthy
    env_file: .env
    # Sin `ports`: en producción el único camino hasta la API es
    # cloudflared → nginx, por la red interna. Publicarlo al host abría un
    # atajo desde la LAN de la escuela que se saltea el túnel, y con él la
    # posibilidad de falsificar CF-Connecting-IP (ver cmd/main.go).
    # docker-compose.dev.yml lo expone para desarrollo.
    networks:
      - sgrc-net

  # nginx sirve la SPA compilada y proxea /api hacia sgrc-app (ver
  # frontend/nginx.conf). Es el único servicio que el túnel expone: todo
  # entra por el mismo origen.
  frontend:
    build: ./frontend
    mem_limit: 128m
    # service_healthy y no el depends_on pelado: nginx arrancaba apenas el
    # contenedor de la API existía, aunque todavía estuviera conectando a
    # Postgres, así que los primeros requests a /api volvían 502. La
    # condición solo aplica al arranque — si la base se cae después, el
    # frontend ya está levantado y sigue sirviendo la SPA.
    depends_on:
      sgrc-app:
        condition: service_healthy
    networks:
      - sgrc-net

  postgres:
    image: postgres:16-alpine
    mem_limit: 512m
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # El esquema NO se monta más en /docker-entrypoint-initdb.d: lo aplica
    # sgrc-app al arrancar, con goose (ver cmd/migrate.go). Montarlo acá
    # además haría que un volumen vacío recibiera las tablas dos veces —
    # Postgres primero, goose después— y la segunda fallaría.
    #
    # El `-h 127.0.0.1` no es decorativo: sin él, `pg_isready` pregunta por
    # el socket Unix, y la imagen oficial levanta ahí un servidor temporal
    # mientras inicializa el cluster. O sea que en el primer arranque el
    # healthcheck daba "sano" con la base todavía inicializándose.
    #
    # Lo que rompía es el arranque desde cero, y solo ese: sgrc-app tiene
    # `depends_on: service_healthy`, así que salía a conectarse, se comía un
    # "FATAL: the database system is starting up" (57P03) y moría con
    # código 1. Compose entonces ni siquiera intentaba el frontend
    # ("dependency failed to start"). Con el volumen ya inicializado no hay
    # scripts que correr y el problema no aparece, así que se manifiesta
    # exactamente una vez: en el estreno, cuando nadie tiene todavía
    # criterio para saber si eso es normal.
    #
    # Por TCP no hay ambigüedad: el servidor temporal de la inicialización
    # no escucha ahí (listen_addresses vacío), así que "acepta conexiones
    # TCP" y "terminó de inicializar" pasan a ser lo mismo.
    #
    # start_period cubre lo otro: inicializar el cluster desde cero lleva su
    # tiempo, y sin él esos fallos legítimos consumen los 5 reintentos y el
    # contenedor queda marcado unhealthy para siempre. Durante el período de
    # gracia los fallos no cuentan.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 60s
    networks:
      - sgrc-net

  # El ingress del túnel se configura en el panel de Cloudflare (tunnel por
  # token, no por config file) y tiene que apuntar a http://frontend:80 —
  # NO a sgrc-app:8080, que ya no es el borde.
  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel run
    env_file: .env
    depends_on:
      - frontend
    networks:
      - sgrc-net

  # ── Observabilidad (opcional) ─────────────────────────────────────
  # Los dos servicios de abajo NO arrancan con `docker compose up`: están
  # detrás de un profile, así que hay que pedirlos:
  #
  #   docker compose --profile observabilidad up -d
  #
  # Es a propósito. El sistema funciona perfectamente sin ellos, y quien
  # clone el repositorio para probarlo no tiene por qué gastar ~400 MB de
  # memoria en tableros que todavía no necesita. Ver docs/12-observabilidad.md.
  prometheus:
    image: prom/prometheus:v3.1.0
    profiles: [observabilidad]
    mem_limit: 512m
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      # Los dos topes existen porque esto corre en el servidor de una
      # institución, no en infraestructura dedicada: sin ellos, la base de
      # métricas crece hasta llenar el disco y el primero en enterarse es
      # Postgres, que deja de poder escribir.
      - --storage.tsdb.retention.time=30d
      - --storage.tsdb.retention.size=1GB
    volumes:
      - ./observabilidad/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observabilidad/alertas.yml:/etc/prometheus/alertas.yml:ro
      - prometheus-datos:/prometheus
    # Sin `ports`: nadie tiene que llegar a Prometheus desde afuera. Lo
    # consulta Grafana por la red interna. Para mirarlo a mano está el túnel
    # de SSH que se explica en la documentación.
    restart: unless-stopped
    networks:
      - sgrc-net

  grafana:
    image: grafana/grafana:11.5.1
    profiles: [observabilidad]
    mem_limit: 256m
    depends_on:
      - prometheus
    environment:
      # La contraseña sale del .env y no queda "admin/admin": los tableros
      # muestran cómo se comporta el sistema por dentro, y esto va a estar
      # escuchando en un servidor compartido.
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-cambiame}
      # Nadie se registra solo ni entra sin usuario.
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - ./observabilidad/grafana/datasources.yml:/etc/grafana/provisioning/datasources/sgrc.yml:ro
      - ./observabilidad/grafana/tableros.yml:/etc/grafana/provisioning/dashboards/sgrc.yml:ro
      - ./observabilidad/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-datos:/var/lib/grafana
    ports:
      # SOLO a 127.0.0.1: se llega desde el propio servidor, o por un túnel
      # de SSH desde otra máquina. Publicarlo en todas las interfaces dejaría
      # un panel de administración expuesto en la red de la institución.
      - "127.0.0.1:3000:3000"
    restart: unless-stopped
    networks:
      - sgrc-net

networks:
  # Subred fija para poder nombrarla en TRUSTED_PROXIES: si Docker la
  # asignara sola, cambiaría entre despliegues y Fiber dejaría de confiar en
  # el proxy sin que nada lo avise.
  sgrc-net:
    ipam:
      config:
        - subnet: 172.28.0.0/16

volumes:
  pgdata:
  # Se crean solo si se levanta el perfil de observabilidad.
  prometheus-datos:
  grafana-datos:
