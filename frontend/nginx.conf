server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # DNS interno de Docker. Hace falta porque los proxy_pass de abajo usan
    # una variable: sin resolver, nginx no arranca; y con el upstream fijo
    # cachearía para siempre la IP que sgrc-app tenía al levantar, lo que
    # rompe el proxy cada vez que ese contenedor se reinicia con otra IP.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Toda la API del binario Go vive bajo /api (ver los RegisterRoutes de
    # cada paquete). Proxearla desde acá es lo que hace que el deploy sea
    # same-origin: el navegador pide /api/... al mismo host que le sirvió la
    # SPA, así que VITE_API_URL queda vacío y no hace falta ni un segundo
    # hostname en el túnel ni preflights de CORS.
    location /api/ {
        set $sgrc_app http://sgrc-app:8080;
        proxy_pass $sgrc_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /health {
        set $sgrc_app http://sgrc-app:8080;
        proxy_pass $sgrc_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        access_log off;
    }

    # Assets con hash en el nombre (Vite) — cacheables para siempre.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        # Repetido acá y no puesto en el server porque nginx deja de heredar
        # los add_header de arriba en cuanto un bloque define uno propio —
        # y este define Cache-Control. Ver nginx-seguridad.conf.
        include /etc/nginx/seguridad.conf;
    }

    # SPA: cualquier ruta que no sea un archivo real cae en index.html para
    # que React Router resuelva el path del lado del cliente.
    #
    # Acá es donde la CSP hace el trabajo real: es el documento HTML, no el
    # JSON de /api, lo que un navegador puede ser engañado de ejecutar.
    location / {
        try_files $uri /index.html;
        include /etc/nginx/seguridad.conf;
    }
}
