# Headers de seguridad para lo que sirve nginx: el HTML de la SPA y sus
# assets. Ver docs/09-seguridad-rbac.md §4.
#
# Los headers equivalentes del binario Go (internal/shared/middleware/
# security.go) salen SOLO en las respuestas de /api, que son JSON — donde
# una CSP no restringe nada real. La CSP que importa es esta: la que
# acompaña al documento HTML.
#
# Este archivo se incluye desde los dos `location` que sirven contenido
# propio (ver nginx.conf) y NO desde el server, a propósito:
#
#   1. nginx no hereda `add_header` hacia un bloque que tenga los suyos, así
#      que ponerlos en el server los haría desaparecer justo en /assets/,
#      que sí define un Cache-Control propio.
#   2. Los bloques que proxean a /api quedan afuera adrede: ahí el binario
#      Go ya manda su propia CSP, y sumar la nuestra dejaría dos headers
#      distintos en la misma respuesta.
#
# `always` para que también salgan en las respuestas de error.

# Cada directiva de la CSP y por qué está:
#
#   default-src 'self'      Todo lo demás, del propio origen. Es el piso.
#   script-src              Además del bundle de Vite ('self'), dos cosas:
#                           el hash del script inline de index.html —el que
#                           aplica el tema antes de pintar, ver el comentario
#                           ahí— y la biblioteca de Google, que no se puede
#                           empaquetar porque el script se comunica con esa
#                           misma página.
#                           NO se usa 'unsafe-inline': el hash cubre el único
#                           script inline que existe. Si alguien edita ese
#                           script y no actualiza el hash, el navegador lo
#                           bloquea y vuelve el fogonazo blanco en modo
#                           oscuro — un síntoma tan callado que hay un test
#                           que compara los dos (csp.test.ts).
#   style-src 'unsafe-inline'  Necesario, no negligencia: la grilla del
#                           calendario posiciona cada bloque con
#                           style={{top,height}} y las barras de los reportes
#                           fijan su ancho igual. Sin esto el calendario
#                           queda con todos los bloques apilados y sin alto.
#                           El riesgo de inyección por CSS es de otro orden
#                           que el de script, que sí queda cerrado.
#   frame-src / connect-src El botón de Google es un iframe de accounts.
#                           google.com y la biblioteca le habla a ese origen.
#   img-src data:           Vite inlinea las imágenes chicas como data: URI.
#   object-src 'none'       No hay plugins; cierra un vector viejo.
#   base-uri 'self'         Impide que una inyección reescriba <base> y
#                           redirija todas las URLs relativas.
#   form-action 'self'      Ningún formulario postea afuera.
#   frame-ancestors 'none'  Anti-clickjacking; es el X-Frame-Options de abajo
#                           en versión moderna. Van los dos.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-8Oc0fOl9q8V1FWMvQBK8TyxwbpXbRxTGRSyBwNoe0Wo=' https://accounts.google.com/gsi/client; style-src 'self' 'unsafe-inline' https://accounts.google.com/gsi/style; frame-src https://accounts.google.com/gsi/; connect-src 'self' https://accounts.google.com/gsi/; img-src 'self' data:; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# HSTS: Cloudflare termina el TLS y le habla al contenedor por HTTP plano,
# así que nginx tampoco "ve" https — se manda igual, por la misma razón por
# la que el binario Go lo fuerza a mano (ver security.go).
add_header Strict-Transport-Security "max-age=31536000; preload" always;
