                        abiertas: { type: integer }
                        graves: { type: integer }

  /api/notifications/leer-todas:
    post:
      tags: [notifications]
      summary: Marcar como leídas todas las notificaciones propias (RF-05.7)
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  marcadas: { type: integer }

  /api/academic/mis-materias:
    get:
      tags: [academic]
      summary: Materias en las que el usuario autenticado puede reservar (RF-04.1)
      description: |
        Un docente ve solo las materias a las que está asignado; un Admin ve
        todas las no archivadas, porque RF-04.1 lo habilita a reservar para
        cualquiera de ellas sin estar asignado.

        Solo devuelve materias de ciclos y cursos NO archivados: "una materia
        de un ciclo ya cerrado no admite reservas nuevas aunque el registro
        se conserve".

        Existe como una sola consulta a propósito: sin esto, para saber "en
        qué materias puedo reservar" habría que recorrer ciclos → cursos →
        materias → docentes desde el cliente.
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        materiaId: { type: string, format: uuid }
                        materiaNombre: { type: string }
                        cursoId: { type: string, format: uuid }
                        cursoNombre: { type: string }
                        cicloId: { type: string, format: uuid }
                        cicloAnio: { type: integer }
