openapi: 3.0.3
info:
  title: SGRC — Sistema de Gestión y Reserva de Computadoras Educativas
  version: "1.0.0"
  description: |
    API mono-institucional para gestión de inventario y reservas de equipos
    informáticos. Monolito modular — un solo servicio, un solo dominio de datos.
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT

servers:
  - url: https://sgrc.tuinstitucion.edu.ar
    description: Producción

tags:
  - name: auth
    description: Autenticación y gestión de usuarios
  - name: academic
    description: Ciclos lectivos, cursos, materias, asignaciones de docentes
  - name: inventory
    description: Carros, equipos, incidencias y licencias de software
  - name: reservations
    description: Reservas simples, recurrentes y bloqueos
  - name: notifications
    description: Notificaciones internas
  - name: reports
    description: Reportes y estadísticas de uso
  - name: availability
    description: Horario de disponibilidad de Admins (informativo)
  - name: sugerencias
    description: Buzón para reportar problemas del sistema o proponer mejoras

# ─────────────────────────────────────────
# COMPONENTES REUTILIZABLES
# ─────────────────────────────────────────
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  # Paginación (internal/shared/paginacion). Solo la usan los tres listados
  # que crecen con el uso: reservas, notificaciones y usuarios. Los demás
  # —ciclos, cursos, materias, carros, equipos— están acotados por el propio
  # dominio (los carga un Admin a mano) y se devuelven completos.
  parameters:
    page:
      in: query
      name: page
      description: Número de página, 1-based. Un valor inválido devuelve 400.
      schema: { type: integer, minimum: 1, default: 1 }
    pageSize:
      in: query
      name: pageSize
      description: |
        Filas por página. El techo es 200: sin él, el parámetro no protegería
        de nada. Un valor inválido devuelve 400.
      schema: { type: integer, minimum: 1, maximum: 200, default: 50 }

  schemas:
    # NOTA: la API NO devuelve un cuerpo JSON en los errores. El handler
    # por defecto de Fiber v2 responde `c.Status(code).SendString(msg)`, así
    # que el body de un 4xx/5xx es TEXTO PLANO (Content-Type: text/plain) y
    # el texto ES el mensaje. Verificado contra el backend corriendo, no
    # inferido del código. Este esquema se conserva solo como referencia de
    # los mensajes posibles; ningún endpoint lo referencia.
    PedidoDeMateria:
      type: object
      description: Pedido de un docente para poder dictar una materia.
      properties:
        id: { type: string, format: uuid }
        usuarioId: { type: string, format: uuid }
        materiaId: { type: string, format: uuid, description: Vacío si la materia todavía no existe }
        cursoSolicitado: { type: string }
        materiaSolicitada: { type: string }
        esMateriaNueva: { type: boolean, description: Al aprobar hay que indicar en qué curso crearla }
        motivo: { type: string }
        estado: { type: string, enum: [PENDIENTE, APROBADO, RECHAZADO] }
        respuesta: { type: string }
        resueltoPor: { type: string, format: uuid }
        resueltoEn: { type: string, format: date-time }
        creadoEn: { type: string, format: date-time }

    Sugerencia:
      type: object
      description: Un mensaje del buzón sobre el sistema.
      properties:
        id: { type: string, format: uuid }
        tipo: { type: string, enum: [SUGERENCIA, PROBLEMA] }
        texto: { type: string }
        pantalla: { type: string, description: Desde dónde se escribió; lo completa la interfaz }
        version: { type: string }
        estado: { type: string, enum: [ABIERTA, RESUELTA] }
        usuarioId: { type: string, format: uuid, description: Solo en el listado del Admin }
        respuesta: { type: string }
        respondidaPor: { type: string, format: uuid }
        respondidaEn: { type: string, format: date-time }
        creadaEn: { type: string, format: date-time }

    ErrorResponse:
      type: string
      description: |
        Mensaje de error en texto plano. Ejemplos reales:
        "credenciales inválidas", "email ya registrado",
        "no se pudo reservar: PC 7 ya está reservado el 13/03 de 10:00 a
        12:00 (Ada Lovelace)".

    ResultadoCascada:
      type: object
      description: |
        Lo que dejó una operación que saca un equipo de circulación (RF-03.8 y
        RF-03.9). Cero en ambos campos es lo normal: significa que no había
        ninguna reserva futura que cancelar.
      properties:
        reservasCanceladas: { type: integer }
        docentesNotificados: { type: integer }

    PaginationMeta:
      type: object
      description: |
        `total` es la cantidad de filas que matchean el filtro, NO las de esta
        página: es lo único con lo que el cliente sabe si hay una siguiente.
      properties:
        total: { type: integer }
        page: { type: integer }
        pageSize: { type: integer }

    # ── Auth ──
    RegistroRequest:
      type: object
      required: [nombre, apellido, email, password]
      properties:
        nombre: { type: string, maxLength: 100 }
        apellido: { type: string, maxLength: 100 }
        email: { type: string, format: email }
        password: { type: string, minLength: 8 }
        cursoSolicitado:
          type: string
          maxLength: 100
          description: |
            Qué curso va a dictar. Texto libre y opcional: al registrarse la
            persona no está autenticada, así que no puede elegir de una lista
            —y lo que declara puede no existir todavía en el sistema—. Es lo
            que el Admin lee al aprobarla para saber a qué asignarla
            (RF-02.6), no una referencia.
        materiaSolicitada:
          type: string
          maxLength: 100
          description: Igual que cursoSolicitado, para la materia.
        rolSolicitado:
          type: string
          enum: [TITULAR, SUPLENTE]
          description: |
            Si se ofrece como titular o como suplente. También opcional, pero a
            diferencia de los dos anteriores tiene lista cerrada —la misma de
            DocenteMateria— y se valida: nombra algo que existe siempre. Sigue
            siendo una declaración; el rol que rige es el que el Admin carga al
            asignar (RF-02.6).

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string }

    LoginResponse:
      type: object
      properties:
        token: { type: string, description: "JWT — presente solo si la cuenta está APROBADA" }
        debeCambiarPassword: { type: boolean, description: "Si es true, el frontend debe forzar la pantalla de cambio de contraseña antes de dejar operar el resto del sistema (RF-01.1/RF-01.6)" }

    Usuario:
      type: object
      properties:
        id: { type: string, format: uuid }
        nombre: { type: string }
        apellido: { type: string }
        email: { type: string }
        rol: { type: string, enum: [ADMIN, DOCENTE] }
        estado: { type: string, enum: [PENDIENTE, APROBADA, RECHAZADA, BAJA] }
        fechaRegistro: { type: string, format: date-time }
        fechaAprobacion: { type: string, format: date-time, nullable: true }
        debeCambiarPassword: { type: boolean }
        cursoSolicitado:
          type: string
          description: Lo que declaró al registrarse (RF-01.3). Ausente si no lo completó.
        materiaSolicitada:
          type: string
          description: Ídem, para la materia.
        rolSolicitado:
          type: string
          enum: [TITULAR, SUPLENTE]
          description: Ídem, para el rol con el que se ofreció.
        tienePassword:
          type: boolean
          description: |
            Si la cuenta puede ingresar con email y contraseña. Es false en las
            creadas con Google, que no tienen ninguna: la pantalla de perfil usa esto
            para no ofrecerles "cambiar contraseña" (que respondería 409).
        vinculadaAGoogle:
          type: boolean
          description: |
            Si la cuenta puede ingresar con Google. Las dos formas no son excluyentes.
            Nunca se expone el identificador de la cuenta de Google en sí.

    # ── Academic ──
    CicloLectivo:
      type: object
      properties:
        id: { type: string, format: uuid }
        anio: { type: integer }
        activo: { type: boolean }
        archivado: { type: boolean }

    Curso:
      type: object
      properties:
        id: { type: string, format: uuid }
        cicloLectivoId: { type: string, format: uuid }
        nombre: { type: string, pattern: '^[1-6]°[A-Z]$', example: "1°A" }
        activo: { type: boolean }
        archivado: { type: boolean }
        materias: { type: array, items: { $ref: '#/components/schemas/Materia' } }

    Materia:
      type: object
      properties:
        id: { type: string, format: uuid }
        cursoId: { type: string, format: uuid }
        nombre: { type: string }
        activo: { type: boolean }
        archivado: { type: boolean }

    PreferenciaDeEquipo:
      type: object
      description: |
        Una marca del inventario que dice que un equipo es preferente para una materia
        (RF-03.21). SÓLO ORDENA la lista al reservar: no restringe a nadie, no oculta el
        equipo y no afecta ninguna reserva.

        El vínculo con la materia es por NOMBRE y no por id porque `materia` se recrea
        con id nuevo en cada ciclo lectivo: una referencia se perdería el 31/12, y la
        marca del inventario tiene que sobrevivir al cambio de año.
      properties:
        id: { type: string, format: uuid }
        equipoId: { type: string, format: uuid }
        materiaNombre: { type: string, example: "Dibujo Técnico" }
        anio: { type: integer, example: 3, description: "Ausente = toda materia con ese nombre, en cualquier curso" }
        division: { type: string, example: "B", description: "Ausente = todas las divisiones de ese año. Nunca viene sin anio" }
        prioridad: { type: integer, example: 1, description: "1 es la más fuerte" }
        alcance: { type: string, example: "Dibujo Técnico de 3°B", description: "La frase ya armada. La resuelve el servidor para que no se reconstruya distinta en cada pantalla" }

    DocenteMateria:
      type: object
      properties:
        id: { type: string, format: uuid }
        usuarioId: { type: string, format: uuid }
        nombre: { type: string }
        apellido: { type: string }
        rol: { type: string, enum: [TITULAR, SUPLENTE] }

    # ── Inventory ──
    Carro:
      type: object
      properties:
        id: { type: string, format: uuid }
        nombre: { type: string }
        descripcion: { type: string, nullable: true }

    Equipo:
      type: object
      properties:
        id: { type: string, format: uuid }
        etiqueta: { type: string, example: "PC 27", description: "Cómo se lo nombra en pantallas y correos: 'PC {identificador}' si está en un carro, el nombre si no. La resuelve el servidor para que la misma cosa no se vea distinta según dónde se la mire (RF-03.17)" }
        tipo: { type: string, maxLength: 50, example: "PROYECTOR", description: "Texto libre. 'PC' en las computadoras de un carro" }
        nombre: { type: string, maxLength: 100, nullable: true, example: "Proyector Epson", description: "Solo en equipos sueltos: es lo único que los distingue, y es único entre ellos sin distinguir mayúsculas. Ausente en las computadoras de un carro" }
        reservable: { type: boolean, description: "Si aparece en la lista de equipos libres al reservar (RF-03.16). Un proyector sí; un cargador no, se presta en el momento" }
        carroId: { type: string, format: uuid, nullable: true, description: "Ausente en un equipo suelto: un proyector no está en ningún carro" }
        identificador: { type: integer, nullable: true, description: "Único dentro del carro, no globalmente — puede repetirse en otro carro. Ausente en un equipo suelto", example: 27 }
        numeroSerie: { type: string, maxLength: 50, nullable: true, example: "5CD1234ABC", description: "Número de serie de fábrica, único en toda la institución. Alfanumérico: se guarda en mayúsculas y sin espacios al borde, así que la respuesta puede diferir de lo enviado. Ausente en un equipo suelto: un cargador puede no traer serie" }
        freezado: { type: boolean, description: "Informativo: indica si tiene Deep Freeze instalado. Sin efecto funcional sobre reservas." }
        cpu: { type: string, nullable: true }
        ram: { type: string, nullable: true }
        sistemaOperativo: { type: string, nullable: true }
        softwareInstalado: { type: string, nullable: true }
        estado: { type: string, enum: [DISPONIBLE, EN_MANTENIMIENTO, FUERA_DE_SERVICIO] }
        dadoDeBaja: { type: boolean, description: "Soft delete: si es true, no aparece en listados activos ni puede reservarse" }
        fechaBaja: { type: string, format: date-time, nullable: true }

    EquipoOcupado:
      type: object
      description: |
        Un equipo que ya tiene dueño en la franja consultada (RF-04.11). Se muestra
        para que el docente pueda ir a hablarle o mandarle un pedido, no para tildarlo.
        Lo que se publica de la otra persona es su nombre — el mismo dato que ya trae el
        calendario de cualquier equipo (RF-04.4)—, nunca su dirección de correo.
      properties:
        equipoId: { type: string, format: uuid }
        etiqueta: { type: string, example: "PC 27" }
        carroNombre: { type: string, nullable: true, description: "Ausente en un equipo suelto" }
        reservaId: { type: string, format: uuid, nullable: true, description: "La Reserva que lo ocupa. Es lo que se le pasa al pedido de liberación. Ausente si lo ocupa un bloqueo administrativo" }
        docenteNombre: { type: string, nullable: true, description: "Quién lo tiene. Ausente en un bloqueo administrativo, que no tiene docente detrás" }
        materiaNombre: { type: string, nullable: true }
        horaInicio: { type: string, example: "10:00", description: "De la reserva que lo ocupa, que puede no coincidir con la franja consultada" }
        horaFin: { type: string, example: "12:00" }
        motivo: { type: string, nullable: true, description: "Solo en un bloqueo administrativo: el texto que escribió el Admin (RF-04.7)" }
        puedePedirse: { type: boolean, description: "false en un bloqueo administrativo, en una reserva propia, y si la franja de esa reserva ya empezó. Lo decide el servidor para que la pantalla no tenga que replicar la regla" }

    Licencia:
      type: object
      description: |
        Licencia de software con vencimiento periódico, instalada en un equipo
        puntual (RF-03.11). Hay una por (equipo, software): el mismo programa en
        todas las máquinas de un carro son tantas licencias como máquinas, cada
        una con su contador — el caso a cubrir es que una quede sin renovar
        mientras las demás sí.
      properties:
        id: { type: string, format: uuid }
        equipoId: { type: string, format: uuid }
        nombre: { type: string, maxLength: 100, example: "AutoCAD 2027", description: "Se guarda sin espacios al borde, respetando mayúsculas. Único por equipo, ignorando la caja." }
        diasDuracion: { type: integer, minimum: 1, maximum: 3650, description: "Cuánto dura una renovación. Es el paso del botón Renovar, no una propiedad inmutable: puede cambiar de 30 a 60." }
        diasAviso: { type: integer, minimum: 0, maximum: 365, default: 1, description: "Con cuánta antelación avisar. 0 = avisar recién el día que vence." }
        fechaVencimiento:
          type: string
          format: date
          nullable: true
          description: |
            AUSENTE significa "todavía no se verificó contra la máquina", NO
            "no vence nunca". Esas licencias no disparan ningún aviso y se
            listan primero.
        ultimaRenovacion:
          type: string
          format: date
          nullable: true
          description: |
            Cuándo se renovó de verdad, que puede no ser cuándo se cargó.
            Ausente si el vencimiento se fijó por quedanDias o venceEl:
            deducirla sería inventar un dato.
        vencimientoFijadoPor: { type: string, format: uuid, nullable: true, description: "Quién escribió el vencimiento en el sistema" }
        vencimientoFijadoEn: { type: string, format: date-time, nullable: true }
        diasRestantes:
          type: integer
          nullable: true
          description: |
            DERIVADO, no está en la base: fechaVencimiento menos hoy. Negativo
            = venció hace esos días. Ausente si no hay fecha. Viaja resuelto
            para que la pantalla, el correo y el job digan lo mismo.
        estado: { type: string, enum: [SIN_FECHA, VENCIDA, POR_VENCER, VIGENTE], description: "Derivado. POR_VENCER depende del diasAviso de esa licencia, no de un umbral fijo." }
        etiqueta: { type: string, example: "PC 3", description: "Cómo se nombra el equipo (RF-03.17). Solo en el listado general. Es lo que se muestra: los dos de abajo van en 0 y \"\" si el equipo no está en ningún carro" }
        identificador: { type: integer, description: "Solo en el listado general" }
        carroId: { type: string, format: uuid }
        carroNombre: { type: string }
        equipoDadoDeBaja: { type: boolean }

    VencimientoDeclarado:
      type: object
      description: |
        Las tres formas de decir cuándo vence. Se manda UNA sola: dos darían
        fechas distintas y elegir cuál gana sería decidir por el Admin (400).
        Ninguna = "todavía no sé", que es un estado válido.
      properties:
        renovadaEl: { type: string, format: date, description: "\"La renové el martes\" → esa fecha + diasDuracion. Puede ser pasada: es el caso del olvido." }
        quedanDias: { type: integer, minimum: 0, description: "\"Quedan 12 días\" → hoy + 12. Es lo que muestra la propia máquina. No acepta negativos: para una ya vencida, usar venceEl." }
        venceEl: { type: string, format: date, description: "La fecha de vencimiento, tal cual." }

    Prestamo:
      type: object
      description: |
        La custodia física de una PC: quién la tiene ahora (RF-08).

        NO es una reserva. La reserva es el derecho a usar una PC en una
        franja; el préstamo es dónde está la máquina. Existen por separado:
        hay reservas que nadie retiró, préstamos sin reserva detrás, y
        préstamos que sobreviven a su reserva.
      properties:
        id: { type: string, format: uuid }
        equipoId: { type: string, format: uuid }
        reservaId: { type: string, format: uuid, nullable: true, description: "Ausente = préstamo espontáneo, sin reserva detrás" }
        entregadoAUsuarioId: { type: string, format: uuid, nullable: true, description: "Solo si quien responde tiene cuenta en el sistema" }
        entregadoANombre: { type: string, maxLength: 200, description: "Quién RESPONDE por el equipo — contra una reserva, siempre el docente. Va siempre, aunque haya cuenta: es un snapshot, para que el registro siga diciendo de quién era la responsabilidad si esa cuenta se elimina" }
        retiradoPor: { type: string, maxLength: 200, nullable: true, description: "Quién vino físicamente a buscarlo, si no fue quien responde. Ausente es el caso normal y significa que lo retiró esa misma persona (RF-08.19)" }
        motivo: { type: string, nullable: true }
        devolucionEstimada:
          type: string
          format: date-time
          nullable: true
          description: |
            Ausente = no se pactó hora. A esa máquina no se le reclama nada:
            "vengo en un rato" es una respuesta válida, y una hora inventada
            solo generaría reclamos falsos.
        entregadoPor: { type: string, format: uuid, nullable: true }
        entregadoEn: { type: string, format: date-time }
        devueltoEn: { type: string, format: date-time, nullable: true, description: "Ausente = la máquina todavía está afuera" }
        recibidoPor: { type: string, format: uuid, nullable: true }
        observaciones: { type: string, nullable: true, description: "Lo que se anota al recibir: \"volvió sin el cargador\"" }
        abierto: { type: boolean, description: "Derivado: devueltoEn ausente" }
        demorado: { type: boolean, description: "Derivado. Un préstamo sin hora pactada NUNCA está demorado" }
        minutosDeDemora: { type: integer, description: "Derivado. 0 si no está demorado" }
        etiqueta: { type: string, example: "Proyector Epson", description: "Cómo se nombra el equipo (RF-03.17). Solo en los listados" }
        identificador: { type: integer, description: "Solo en los listados" }
        carroNombre: { type: string }
        materiaNombre: { type: string, nullable: true, description: "Solo en préstamos que salieron contra una reserva" }

    ResultadoEntrega:
      type: object
      description: |
        Qué salió y qué no. `noEntregadas` no es un error del request: el lote
        se procesó, y el código de cada rechazo permite ofrecer la acción que
        corresponde ("ver quién la tiene" no es lo mismo que "revisá el
        inventario").
      properties:
        entregadas:
          type: array
          items: { $ref: '#/components/schemas/Prestamo' }
        noEntregadas:
          type: array
          items:
            type: object
            properties:
              equipoId: { type: string, format: uuid }
              razon: { type: string, enum: [YA_ENTREGADA, FUERA_DEL_INVENTARIO, RESERVA_CANCELADA, SIN_DESTINATARIO], description: "SIN_DESTINATARIO: la reserva es un bloqueo administrativo y no tiene docente. Se resuelve mandando retiradoPor, que en ese caso pasa a ser el responsable: no hay docente a quien anteponerle." }
              detalle: { type: string }
        avisos:
          type: array
          description: "Reservas próximas de las máquinas entregadas. Solo en las entregas espontáneas: en las que salen contra una reserva, la reserva ES el permiso."
          items:
            type: object
            properties:
              equipoId: { type: string, format: uuid }
              fecha: { type: string, format: date }
              horaInicio: { type: string, example: "10:00" }
              horaFin: { type: string, example: "11:00" }
              docente: { type: string }

    Incidencia:
      type: object
      properties:
        id: { type: string, format: uuid }
        equipoId: { type: string, format: uuid }
        reportadoPor: { type: string, format: uuid }
        descripcion: { type: string }
        categoria:
          type: string
          description: |
            Qué tipo de falla es, en texto libre (RF-03.5). Se omite cuando
            todavía no se diagnosticó, que es un estado válido y no un dato
            faltante.
          example: batería
        gravedad: { type: string, enum: [LEVE, MODERADA, GRAVE] }
        fecha: { type: string, format: date-time }
        enviadoDGE: { type: boolean }
        fechaEnvioDGE: { type: string, format: date-time, nullable: true }
        estado: { type: string, enum: [ABIERTA, EN_REPARACION, ENVIADA_A_SOPORTE, RESUELTA] }

    # ── Reservations ──
    ReservaRequest:
      type: object
      required: [equipoIds, materiaId, fecha, horaInicio, horaFin]
      properties:
        equipoIds: { type: array, items: { type: string, format: uuid }, minItems: 1, description: "Uno o varios equipos elegidos de la lista de disponibles" }
        materiaId: { type: string, format: uuid }
        fecha: { type: string, format: date }
        horaInicio: { type: string, pattern: '^\d{2}:\d{2}$', example: "10:00" }
        horaFin: { type: string, pattern: '^\d{2}:\d{2}$', example: "11:30" }

    ReservaRecurrenteRequest:
      type: object
      required: [equipoIds, materiaId, diaSemana, horaInicio, horaFin, fechaInicio, fechaFin]
      properties:
        equipoIds: { type: array, items: { type: string, format: uuid }, minItems: 1 }
        materiaId: { type: string, format: uuid }
        diaSemana: { type: string, enum: [LUNES, MARTES, MIERCOLES, JUEVES, VIERNES, SABADO, DOMINGO] }
        horaInicio: { type: string, example: "10:00" }
        horaFin: { type: string, example: "11:30" }
        fechaInicio: { type: string, format: date }
        fechaFin: { type: string, format: date }

    ReservaGrupo:
      type: object
      description: "La reserva tal como la ve el docente — una materia, fecha y horario, con uno o varios equipos."
      properties:
        id: { type: string, format: uuid }
        materiaId: { type: string, format: uuid }
        materiaNombre: { type: string }
        cursoNombre: { type: string }
        creadoPor: { type: string, format: uuid }
        nombreDocenteSnapshot: { type: string }
        fecha: { type: string, format: date }
        horaInicio: { type: string }
        horaFin: { type: string }
        estado: { type: string, enum: [CONFIRMADA, PARCIALMENTE_CANCELADA, CANCELADA, FINALIZADA, NO_RETIRADA] }
        esRecurrente: { type: boolean }
        reglaRecurrenciaId: { type: string, format: uuid, nullable: true }
        creadaEn: { type: string, format: date-time }
        reservas: { type: array, items: { $ref: '#/components/schemas/Reserva' }, description: "Detalle por equipo" }

    Reserva:
      type: object
      description: "La ocupación de UN equipo en UNA franja, dentro de un ReservaGrupo (o una fila BLOQUEO suelta, sin grupo)."
      properties:
        id: { type: string, format: uuid }
        reservaGrupoId: { type: string, format: uuid, nullable: true, description: "NULL solo para tipo BLOQUEO" }
        equipoId: { type: string, format: uuid }
        etiqueta: { type: string, example: "PC 3", description: "Cómo se nombra el equipo (RF-03.17). Solo en los listados detallados. Es lo que se muestra: identificador va en 0 y carroNombre vacío si el equipo no está en ningún carro" }
        identificador: { type: integer }
        estado: { type: string, enum: [CONFIRMADA, CANCELADA, FINALIZADA, NO_RETIRADA] }
        tipo: { type: string, enum: [NORMAL, BLOQUEO] }
        motivoBloqueo:
          type: string
          nullable: true
          example: Jornada docente
          description: |
            Por qué se tomó el equipo. Solo en los BLOQUEO, y ahí va siempre:
            es obligatorio al crearlos. Las pantallas lo muestran en el lugar
            donde una clase muestra su materia.
        motivoCancelacion: { type: string, nullable: true }
        canceladaEn: { type: string, format: date-time, nullable: true }
        creadaEn: { type: string, format: date-time }

    BloqueoRequest:
      type: object
      required: [equipoIds, fecha, horaInicio, horaFin, motivo]
      properties:
        equipoIds: { type: array, minItems: 1, items: { type: string, format: uuid }, description: "Los equipos a bloquear. Pueden ser de carros distintos." }
        fecha: { type: string, format: date }
        horaInicio: { type: string, example: "08:00" }
        horaFin: { type: string, example: "18:00" }
        motivo:
          type: string
          maxLength: 500
          example: Jornada docente
          description: |
            Obligatorio. Texto libre: el sistema no puede prever por qué una
            institución se toma el laboratorio —una evaluación, una jornada
            docente, una capacitación, una obra en el aula—.

            Se aparta del criterio de los otros textos libres del sistema, que
            sí admiten vacío, porque un bloqueo le cancela la clase a otra
            persona. Se guarda en cada bloqueo y viaja tal cual al aviso de
            los docentes afectados, sin envolverlo en ninguna categoría.

    # ── Notifications ──
    Notificacion:
      type: object
      properties:
        id: { type: string, format: uuid }
        mensaje: { type: string }
        estado: { type: string, enum: [NO_LEIDA, LEIDA] }
        reservaId: { type: string, format: uuid, nullable: true, description: "Apunta a la Reserva puntual, no al grupo" }
        creadaEn: { type: string, format: date-time }
        tipo:
          type: string
          enum: [GENERAL, DOCENTE_PENDIENTE, RESERVA_CANCELADA, LICENCIA_POR_VENCER, RESERVA_POR_COMENZAR, RESERVA_NO_RETIRADA, EQUIPO_SIN_DEVOLVER, PEDIDO_DE_LIBERACION]
          description: |
            De qué se trata el aviso, para que la interfaz pueda ofrecer la
            acción que corresponde sin interpretar el texto del mensaje. Un
            aviso de cancelación agrupa TODO lo que se le canceló a esa
            persona en una misma operación: bloquear tres equipos de una clase
            genera una notificación con las tres, no tres avisos.

            PEDIDO_DE_LIBERACION es el único de esta lista que **no anuncia un
            cambio**: la reserva del destinatario sigue intacta y la decisión es
            suya (RF-04.12). La pantalla no puede ofrecerle el mismo botón que a
            un aviso de cancelación.

    # ── Availability ──
    BloqueHorarioAdmin:
      type: object
      properties:
        id: { type: string, format: uuid }
        diaSemana: { type: string, enum: [LUNES, MARTES, MIERCOLES, JUEVES, VIERNES, SABADO, DOMINGO] }
        horaInicio: { type: string, example: "08:00" }
        horaFin: { type: string, example: "12:00" }

    ExcepcionHorarioAdmin:
      type: object
      properties:
        id: { type: string, format: uuid }
        fecha: { type: string, format: date }
        tipo: { type: string, enum: [NO_DISPONIBLE, HORARIO_MODIFICADO] }
        horaInicio: { type: string, nullable: true, example: "09:00" }
        horaFin: { type: string, nullable: true, example: "11:00" }
        motivo: { type: string, nullable: true }

    AdminDisponibilidad:
      type: object
      properties:
        usuarioId: { type: string, format: uuid }
        nombre: { type: string }
        apellido: { type: string }
        disponibleAhora: { type: boolean }
        excepcionHoy: { $ref: '#/components/schemas/ExcepcionHorarioAdmin', nullable: true }
        horarioSemanal: { type: array, items: { $ref: '#/components/schemas/BloqueHorarioAdmin' } }

# ─────────────────────────────────────────
# PATHS
# ─────────────────────────────────────────
paths:

  # ══════════════════════════════
  # AUTH
  # ══════════════════════════════
  /api/auth/registro:
    post:
      tags: [auth]
      summary: Autorregistro de docente
      description: |
        Crea cuenta con rol DOCENTE y estado PENDIENTE hasta aprobación de un ADMIN.
        Notifica a todos los usuarios con rol ADMIN y estado APROBADA (RF-05.6) para
        que no dependan de revisar la lista manualmente.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegistroRequest' }
      responses:
        "201": { description: Cuenta creada, pendiente de aprobación. Todos los Admin son notificados. }
        "409":
          description: |
            Email ya registrado. Si pertenece a una cuenta en estado BAJA, el mensaje
            lo indica explícitamente (RF-01.3) en vez de un genérico "ya registrado",
            para que quien vuelve entienda que es su propia cuenta vieja.

  /api/auth/login:
    post:
      tags: [auth]
      summary: Login
      description: Devuelve JWT si la cuenta está APROBADA. Si está PENDIENTE o RECHAZADA, responde 403.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoginResponse' }
        "401": { description: Credenciales inválidas }
        "403":
          description: |
            Cuenta no aprobada. El cuerpo distingue el motivo —pendiente de aprobación,
            rechazada o dada de baja— en vez de un genérico: para llegar hasta acá la
            persona ya presentó la credencial correcta, así que decirle en qué estado
            está su propia cuenta no revela nada. El frontend muestra ese texto tal cual.

  /api/auth/config:
    get:
      tags: [auth]
      summary: Configuración pública (sin autenticar)
      description: |
        Lo que la pantalla de login necesita saber antes de que haya sesión: qué
        formas de ingreso ofrecer. Las dos son capacidades opcionales del
        despliegue, y la pantalla no dibuja lo que el backend no puede hacer.

        - googleClientId vacío = no hay GOOGLE_CLIENT_ID configurado, no se dibuja
          el botón de Google.
        - recuperacionPorEmail en false = no hay SMTP configurado, no se muestra
          "olvidé mi contraseña" (los dos endpoints de /password/* responden 503).

        El client ID viaja acá y no compilado en el bundle porque el frontend se
        construye una vez dentro de la imagen Docker; en el build habría que
        reconstruir la imagen para cambiarlo. No es un secreto: el navegador se lo
        manda a Google en cada pedido.
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                required: [googleClientId, recuperacionPorEmail]
                properties:
                  googleClientId: { type: string, example: "123-abc.apps.googleusercontent.com" }
                  recuperacionPorEmail: { type: boolean, example: true }

  /api/auth/password/olvide:
    post:
      tags: [auth]
      summary: Pedir un código para recuperar la contraseña (público)
      description: |
        Paso 1 de la recuperación por autoservicio. Genera un código de 6 dígitos,
        lo guarda hasheado (argon2, igual que una contraseña) y lo manda al email
        de la cuenta. Vence a los 15 minutos, sirve una sola vez y admite 5
        intentos fallidos; pedir uno nuevo invalida el anterior.

        **Responde 202 exista o no la cuenta**, y el cuerpo es siempre el mismo.
        Es deliberado: cualquier diferencia observable —el mensaje, el código, o el
        tiempo que tarda— convertiría este formulario en un padrón de las
        direcciones registradas en la escuela. Por eso el código se genera y se
        hashea ANTES de buscar la cuenta, para que los dos caminos tarden lo mismo.

        Casos que NO reciben código, todos con la misma respuesta 202:
        una cuenta inexistente; una que no está APROBADA (pendiente, rechazada o en
        baja: no tiene a dónde entrar); y una creada con Google, que no tiene
        contraseña propia — a esa sí le llega un correo, pero explicándole que entra
        con el botón de Google. Sin ese correo el síntoma sería "pedí el código y
        nunca llegó".

        Rate limit: 5/min por IP y 3/min por email. El segundo es el que importa —
        sin él, cambiar de red alcanza para inundar de correo la casilla de un
        docente y quemarle la reputación al Gmail de la escuela.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        "202":
          description: Pedido aceptado (no dice si se mandó algo)
          content:
            application/json:
              schema:
                type: object
                properties:
                  mensaje: { type: string }
        "400": { description: El email no tiene formato válido }
        "429": { description: Demasiados pedidos }
        "503": { description: No hay SMTP configurado en este despliegue }

  /api/auth/password/restablecer:
    post:
      tags: [auth]
      summary: Cambiar la contraseña con el código recibido por email (público)
      description: |
        Paso 2. Consume el código y deja la contraseña elegida por la persona, con
        debeCambiarPassword en false (la eligió ella, no es una temporal).

        No devuelve token: el cambio no inicia sesión. Quien lo hizo vuelve al login
        y entra con la contraseña nueva, lo que de paso comprueba que la recuerda.

        El email viaja de nuevo en el cuerpo, sin sesión intermedia del lado del
        servidor: así el paso 2 funciona aunque el código se haya pedido desde la
        computadora de la escuela y se lea en el celular.

        Los 400 distinguen tres situaciones a propósito distinto grado: "vencido" y
        "sin intentos" se dicen tal cual, porque le pasan a la persona legítima y
        necesita saber que tiene que pedir otro código en vez de seguir tipeando.
        Todo lo demás —email inexistente, cuenta sin código, código equivocado—
        colapsa al mismo mensaje, por lo mismo que el endpoint anterior.

        Queda auditado (PASSWORD_RECUPERADA_POR_EMAIL, con la IP): es la única
        acción del catálogo cuyo actor no está autenticado.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, codigo, passwordNueva]
              properties:
                email: { type: string, format: email }
                codigo: { type: string, pattern: '^\d{6}$', example: "482913" }
                passwordNueva: { type: string, minLength: 8 }
      responses:
        "204": { description: Contraseña cambiada }
        "400": { description: Código inválido, vencido, sin intentos, o contraseña corta }
        "429": { description: Demasiados intentos }
        "503": { description: No hay SMTP configurado en este despliegue }

  /api/auth/google:
    post:
      tags: [auth]
      summary: Ingreso con una cuenta de Google ya registrada
      description: |
        Recibe el ID token que Google le entregó al navegador, verifica su firma
        contra las claves públicas de Google (RS256, `aud` = nuestro client ID,
        `iss` de Google, `exp` vigente y `email_verified` en true) y devuelve el JWT
        propio del sistema — el mismo que devuelve /api/auth/login.

        No crea cuentas. Si el token es válido pero no hay ninguna cuenta con ese
        email, responde **404**: eso no es un fallo sino el camino normal la primera
        vez, y es lo que le indica al frontend que tiene que llevar a la persona a
        POST /api/auth/google/registro con el mismo token.

        Si existe una cuenta con ese email creada con contraseña, se le agrega el
        vínculo con Google y conserva su contraseña: las dos formas de ingreso
        conviven. Vincular por email es seguro solo porque antes se exigió
        `email_verified`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [credential]
              properties:
                credential: { type: string, description: ID token emitido por Google }
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoginResponse' }
        "400": { description: Cuerpo malformado }
        "401": { description: El token de Google no es válido (firma, aud, exp o emisor) }
        "403":
          description: |
            Google no confirmó el email (`email_verified` en false), el dominio no está
            en GOOGLE_DOMINIOS_PERMITIDOS, o la cuenta existe pero no está APROBADA.
        "404": { description: Token válido pero todavía no hay cuenta con ese email — seguir al registro }
        "409": { description: El email pertenece a una cuenta en BAJA (RF-01.3) }
        "503": { description: Este despliegue no tiene GOOGLE_CLIENT_ID configurado }

  /api/auth/google/registro:
    post:
      tags: [auth]
      summary: Autorregistro de docente con cuenta de Google
      description: |
        Igual que /api/auth/registro pero sin contraseña: la cuenta queda con rol
        DOCENTE y estado PENDIENTE hasta que un ADMIN la apruebe, y notifica a todos
        los Admin (RF-05.6). Tener una cuenta de Google válida prueba quién sos, no
        que la escuela te conozca.

        `nombre` y `apellido` son opcionales: vacíos, se usan los del token
        (`given_name` / `family_name`). Se aceptan del request porque esos claims no
        son obligatorios y porque el nombre de una cuenta personal no siempre es el
        que figura en la escuela. El email NO se acepta del request: sale del token.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [credential]
              properties:
                credential: { type: string }
                nombre: { type: string, maxLength: 100 }
                apellido: { type: string, maxLength: 100 }
                cursoSolicitado: { type: string, maxLength: 100 }
                materiaSolicitada: { type: string, maxLength: 100 }
                rolSolicitado: { type: string, enum: [TITULAR, SUPLENTE] }
      responses:
        "201": { description: Cuenta creada, pendiente de aprobación }
        "400": { description: Cuerpo malformado, o falta el nombre tanto en el request como en el token }
        "401": { description: El token de Google no es válido }
        "403": { description: Email sin confirmar por Google, o dominio no habilitado }
        "409":
          description: |
            Ya existe una cuenta para ese email o esa cuenta de Google. Si pertenece a
            una cuenta en BAJA, el mensaje lo indica explícitamente (RF-01.3).
        "503": { description: Este despliegue no tiene GOOGLE_CLIENT_ID configurado }

  /api/auth/usuarios/{id}/promover-a-admin:
    post:
      tags: [auth]
      summary: Promover un docente a ADMIN
      description: |
        Le da rol ADMIN a un docente ya aprobado. Solo ADMIN.

        La operación inversa es `POST /api/auth/usuarios/{id}/degradar-a-docente`.
        Son dos rutas que dicen lo que hacen y no un `PATCH /rol` genérico: cada una
        tiene sus propias condiciones y su propia entrada de auditoría.

        La cuenta tiene que estar en estado APROBADA. Promover una PENDIENTE sería
        aprobarla por la puerta de atrás, salteándose el paso donde alguien mira quién
        es esa persona (RF-01.3).

        **No toca nada más de la cuenta**: conserva sus materias asignadas, sus
        reservas y sus formas de ingreso (contraseña y/o Google). Un docente que pasa
        a coordinar suele seguir dando clase, y el sistema no lo impide — academic
        solo exige estado APROBADA para asignar a alguien a una materia, nunca miró
        el rol, y reservar tampoco pide rol.

        **Tiene efecto en el request siguiente**, sin volver a iniciar sesión: el
        middleware lee el rol de la base en cada pedido y pisa el del token
        (ver `09-seguridad-rbac.md` §1).

        No hace falta el guard del último Admin (RF-01.8): esto solo agrega Admins,
        nunca los saca.
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200": { description: Promovido. Queda registrado en auditoría quién lo hizo y a quién }
        "403": { description: Quien lo pide no es ADMIN }
        "404": { description: Usuario no encontrado }
        "409":
          description: |
            La cuenta ya tiene rol ADMIN, o no está APROBADA. El mensaje distingue los
            dos casos, que es lo que el Admin necesita para saber qué hacer.

  /api/auth/usuarios/{id}/degradar-a-docente:
    post:
      tags: [auth]
      summary: Quitarle el rol ADMIN a un Admin
      description: |
        La inversa de promover: le saca los permisos de Admin y lo deja como docente,
        **sin cerrarle la cuenta**. Solo ADMIN.

        Existe porque, sin ella, la única forma de sacar a un Admin era darle de baja
        la cuenta entera —perdiendo sus materias y cancelándole las reservas— por un
        cambio que era solo de permisos.

        La cuenta tiene que estar en estado APROBADA: en una RECHAZADA o en BAJA el rol
        ya no habilita nada, porque esos estados no entran al sistema.

        **Dos frenos que promover no necesita**, porque esta sí puede reducir la
        cantidad de Admins:

        - El guard del último Admin (RF-01.8), dentro de la misma transacción que la
          escritura: nunca puede quedar el sistema sin ningún Admin activo.
        - Nadie se degrada a sí mismo: perdería en el acto las pantallas desde las que
          lo pidió y dependería de otro Admin para volver atrás.

        **No toca nada más de la cuenta**: conserva materias, reservas y formas de
        ingreso. Lo único que deja de figurar es su horario de atención, porque la
        lista de Admins se arma filtrando por rol — si lo vuelven a promover, reaparece
        con el horario que ya tenía cargado.

        **Tiene efecto en el request siguiente**, sin volver a iniciar sesión, igual
        que promover.
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200": { description: Degradado. Queda registrado en auditoría quién lo hizo y a quién }
        "403": { description: Quien lo pide no es ADMIN }
        "404": { description: Usuario no encontrado }
        "409":
          description: |
            La cuenta ya es DOCENTE, no está APROBADA, es el último Admin activo
            (RF-01.8), o es la de quien está pidiendo el cambio. El mensaje distingue
            los cuatro casos.

  /api/auth/me:
    get:
      tags: [auth]
      summary: Datos del usuario autenticado
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Usuario' }

  /api/auth/cambiar-password:
    post:
      tags: [auth]
      summary: Cambiar mi propia contraseña
      description: |
        Disponible para cualquier usuario autenticado en cualquier momento (RF-01.7),
        no solo cuando debeCambiarPassword=true. Si la cuenta tenía ese flag en true,
        se limpia a false al cambiar exitosamente.

        Una cuenta creada con Google no tiene contraseña actual que verificar ni nada
        que cambiar: responde 409. Un Admin sí puede generarle una con
        POST /api/auth/usuarios/{id}/reset-password, que es la forma de devolverle el
        acceso a alguien que perdió su cuenta de Google; eso no rompe el vínculo.

        Ojo con el código de `passwordActual` incorrecta: es **400 y no 401**. Quien
        llega hasta acá ya está autenticado —el token se validó— y lo que vino mal es
        un campo del cuerpo. Un 401 con token válido significa "tu sesión ya no vale",
        y un cliente que lo trate así va a cerrarle la sesión a alguien que solo se
        equivocó tipeando.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [passwordActual, passwordNueva]
              properties:
                passwordActual: { type: string }
                passwordNueva: { type: string, minLength: 8 }
      responses:
        "200": { description: Contraseña actualizada }
        "400": { description: passwordActual incorrecta, o passwordNueva más corta que 8 caracteres }
        "409": { description: La cuenta ingresa con Google y no tiene contraseña }

  /health:
    get:
      summary: Estado del servicio
      description: |
        Verifica que el proceso pueda llegar a Postgres, no solo que esté vivo.
        Un health que responde 200 con la base caída da por sano a un proceso
        que no puede atender ni un login.

        Sin autenticación: lo consume el HEALTHCHECK del contenedor (el propio
        binario, con `sgrc-app healthcheck` — ver cmd/healthcheck.go).
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [ok] }
                  time: { type: string, format: date-time }
        "503":
          description: La base de datos no responde
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [degradado] }
                  error: { type: string }
                  time: { type: string, format: date-time }

  /api/auth/usuarios:
    get:
      tags: [auth]
      summary: Listar usuarios (Admin)
      security: [{ bearerAuth: [] }]
      parameters:
        - in: query
          name: estado
          schema: { type: string, enum: [PENDIENTE, APROBADA, RECHAZADA, BAJA] }
        - in: query
          name: rol
          schema: { type: string, enum: [ADMIN, DOCENTE] }
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/pageSize'
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/Usuario' } }
                  meta: { $ref: '#/components/schemas/PaginationMeta' }
        "400": { description: page o pageSize inválidos }

  /api/auth/usuarios/{id}/estado:
    patch:
      tags: [auth]
      summary: Aprobar, rechazar o dar de baja una cuenta (Admin)
      description: |
        Al pasar a BAJA, revisa las materias del docente: si alguna queda sin ningún
        otro docente activo, cancela sus ReservaGrupo futuros; si conserva otro docente,
        solo genera un aviso informativo a todos los Admin (RF-02.8). Nunca cancela
        reservas de una materia que sigue teniendo otro docente asignado. Después de
        esa revisión, elimina todos los vínculos DocenteMateria del docente dado de baja.
        Rechaza con 409 si el usuario es el único ADMIN en estado APROBADA y el nuevo
        estado no es APROBADA (RF-01.8) — el sistema nunca puede quedar sin ningún Admin.
        Rechaza con 409 si el estado actual del usuario ya es BAJA — es terminal, no
        se puede revertir (RF-02.9). Para volver a operar, la persona debe registrarse
        de nuevo (RF-01.3).
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [estado]
              properties:
                estado: { type: string, enum: [APROBADA, RECHAZADA, BAJA] }
      responses:
        "200":
          description: Estado actualizado (con detalle de impacto si fue BAJA)
          content:
            application/json:
              schema:
                type: object
                properties:
                  estado: { type: string, enum: [PENDIENTE, APROBADA, RECHAZADA, BAJA] }
                  materiasRevisadas: { type: integer }
                  materiasHuerfanas: { type: integer }
                  reservasCanceladas: { type: integer }
        "403": { description: Solo un Admin puede cambiar este estado }
        "409": { description: No se puede dejar al sistema sin ningún Admin activo, o la cuenta ya está en BAJA (transición terminal) }

  /api/auth/usuarios/{id}/reset-password:
    post:
      tags: [auth]
      summary: Resetear la contraseña de un usuario a una temporal (Admin)
      description: |
        Recuperación asistida por Admin (RF-01.6). Marca debeCambiarPassword=true; el
        usuario debe cambiarla (POST /api/auth/cambiar-password) antes de operar el
        resto del sistema.

        Es el camino de **rescate**, no el habitual: el habitual es que la persona lo
        haga sola (POST /api/auth/password/olvide). Este sirve para quien no puede
        recibir el mail —email mal escrito al registrarse, casilla de la escuela dada
        de baja, acceso perdido— y es el único disponible en un despliegue sin SMTP
        configurado. Sin él, esa persona no tendría forma de volver a entrar.
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Contraseña temporal generada
          content:
            application/json:
              schema:
                type: object
                properties:
                  passwordTemporal: { type: string, description: "Mostrar una sola vez al Admin; el usuario debe cambiarla al ingresar" }

  /api/auth/usuarios/{id}:
    delete:
      tags: [auth]
      summary: Eliminar definitivamente una cuenta cerrada (Admin)
      description: |
        Solo permitido si el usuario está en uno de los dos estados terminales, BAJA
        o RECHAZADA (RF-01.9) — libera su email para un nuevo registro (RF-02.9).
        RECHAZADA cuenta porque no transiciona a ningún otro estado: sin esta salida,
        un rechazo equivocado dejaba el email tomado de forma permanente. Una cuenta
        APROBADA hay que darla de baja primero, y una PENDIENTE hay que resolverla.
        Sus reservas, incidencias y notificaciones
        no se eliminan: las FKs que las referencian usan ON DELETE SET NULL (conservan
        nombre_docente_snapshot u otro texto ya guardado) salvo docente_materia y
        notificacion.usuario_id, que sí se eliminan en cascada por no tener sentido sin
        la cuenta (ver 07-modelo-datos.md).
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200": { description: Cuenta eliminada definitivamente }
        "409": { description: Solo se puede eliminar una cuenta en estado BAJA }

  /api/auth/admins:
    post:
      tags: [auth]
      summary: Crear otro Admin (Admin)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegistroRequest' }
      responses:
        "201": { description: Admin creado (aprobado automáticamente) }
        "403": { description: Solo un Admin puede crear otro Admin }

  # ══════════════════════════════
  # ACADEMIC
  # ══════════════════════════════
  /api/academic/ciclos:
    get:
      tags: [academic]
      summary: Listar ciclos lectivos
      security: [{ bearerAuth: [] }]
      parameters:
        - in: query
          name: archivado
          schema: { type: boolean }
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/CicloLectivo' } }
    post:
      tags: [academic]
      summary: Crear ciclo lectivo (Admin)
      description: Solo puede existir un ciclo lectivo activo a la vez (RF-02.1).
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [anio]
              properties:
                anio: { type: integer, example: 2025 }
      responses:
        "201": { description: Ciclo creado }
        "409": { description: Ya existe ciclo para ese año, o ya hay un ciclo activo sin archivar }

  /api/academic/ciclos/{id}/archivar:
    post:
      tags: [academic]
      summary: Archivar ciclo y opcionalmente clonar al siguiente año (Admin)
      description: |
        Preserva curso/materia/docente_materia (archivado=true) para no recrearlos.
        Antes de nada, calcula y guarda un snapshot histórico agregado (historico_uso_equipo,
        historico_uso_docente). Luego ELIMINA FÍSICAMENTE todos los ReservaGrupo, Reserva
        y ReglaRecurrencia de las materias de ese ciclo, más los bloqueos por evaluación
        estatal de ese año. Incidencia no se ve afectada (pertenece al equipo, no al ciclo).

        **Si se pide `clonarA`, el año destino se verifica ANTES de archivar**: que sea un
        año válido y que no exista ya un ciclo con ese año. El borrado es irreversible, así
        que un año repetido devuelve 409 con el ciclo viejo intacto — no después de haberlo
        destruido.

        La operación es reintentable: si un intento anterior quedó a medias (reservas sin
        borrar, o el clonado sin hacer), volver a llamar completa lo que faltó en vez de
        rechazar por "ya archivado".
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                clonarA: { type: integer, description: "Año destino del clon. Omitir si no se desea clonar.", example: 2026 }
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  archivado: { type: boolean }
                  nuevoCicloId: { type: string, format: uuid, nullable: true }
                  cursosClonados: { type: integer }
                  materiasClonadas: { type: integer }
        "409":
          description: |
            El ciclo ya estaba archivado y no quedaba nada pendiente, o el año
            destino del clon ya tiene un ciclo. En los dos casos no se tocó nada.
          content:
            text/plain:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /api/academic/ciclos/{cicloId}/cursos:
    get:
      tags: [academic]
      summary: Listar cursos del ciclo
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: cicloId
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/Curso' } }
    post:
      tags: [academic]
      summary: Crear curso en el ciclo (Admin)
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: cicloId
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nombre]
              properties:
                nombre: { type: string, pattern: '^[1-6]°[A-Z]$', example: "1°A" }
      responses:
        "201": { description: Curso creado }
        "400": { description: "Nombre no cumple el patrón {año}°{división}, ej. 1°A" }

  /api/academic/cursos/{id}:
    patch:
      tags: [academic]
      summary: Editar nombre de un curso (Admin)
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                nombre: { type: string, pattern: '^[1-6]°[A-Z]$', example: "1°A" }
      responses:
        "200": { description: Curso actualizado }
        "400": { description: "Nombre no cumple el patrón {año}°{división}, ej. 1°A" }
        "409": { description: Ya existe otro curso con ese nombre en el mismo ciclo lectivo }
    delete:
      tags: [academic]
      summary: Eliminar un curso (Admin)
      description: |
        Solo permitido si ninguna de sus materias tiene reservas asociadas (RF-02.11).
        Para un curso con historial, la única opción es archivar el ciclo completo.
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200": { description: Curso eliminado }
        "409": { description: El curso tiene materias con reservas asociadas — no se puede eliminar }

  /api/academic/cursos/{cursoId}/materias:
    get:
      tags: [academic]
      summary: Listar materias del curso
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: cursoId
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/Materia' } }
    post:
      tags: [academic]
      summary: Crear materia en el curso (Admin)
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: cursoId
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nombre]
              properties:
                nombre: { type: string, example: "Matemáticas" }
      responses:
        "201": { description: Materia creada }

  /api/academic/materias/{id}:
    patch:
      tags: [academic]
      summary: Editar nombre de una materia (Admin)
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                nombre: { type: string, example: "Matemáticas" }
      responses:
        "200": { description: Materia actualizada }
        "409": { description: Ya existe otra materia con ese nombre en el mismo curso }
    delete:
      tags: [academic]
      summary: Eliminar una materia (Admin)
      description: |
        Solo permitido si no tiene reservas asociadas (RF-02.11). Con historial,
        la única opción es archivar el ciclo completo.
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200": { description: Materia eliminada }
        "409": { description: La materia tiene reservas asociadas — no se puede eliminar }

  /api/academic/materias/{materiaId}/docentes:
    get:
      tags: [academic]
      summary: Listar docentes asignados a la materia
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: materiaId
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/DocenteMateria' } }
    post:
      tags: [academic]
      summary: Asignar docente a materia (Admin)
      description: Solo se puede asignar a un usuario en estado APROBADA (RF-02.6).
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: materiaId
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [usuarioId, rol]
              properties:
                usuarioId: { type: string, format: uuid }
                rol: { type: string, enum: [TITULAR, SUPLENTE] }
      responses:
        "201": { description: Docente asignado }
        "404": { description: Usuario no encontrado }
        "409": { description: El usuario no está en estado APROBADA }

  /api/academic/materias/{materiaId}/docentes/{docenteMateriaId}:
    patch:
      tags: [academic]
      summary: Cambiar el rol de un docente asignado (Admin)
      description: |
        Corrige el rol de una asignación existente (RF-02.6). Es el único camino
        para pasar de titular a suplente o al revés: el otro —quitar y volver a
        asignar— pasa por la cascada de RF-02.10 y, si es el único docente de la
        materia, cancela todas sus reservas futuras.

        No toca nada más que el rol. El usuario y la materia de un vínculo no se
        editan: cambiar cualquiera de los dos es otro vínculo.
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: materiaId
          required: true
          schema: { type: string, format: uuid }
        - in: path
          name: docenteMateriaId
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [rol]
              properties:
                rol: { type: string, enum: [TITULAR, SUPLENTE] }
      responses:
        "200":
          description: Rol actualizado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DocenteMateria" }
        "400": { description: Rol inválido o cuerpo malformado }
        "403": { description: Solo ADMIN }
        "404": { description: La asignación no existe }
    delete:
      tags: [academic]
      summary: Remover docente de materia (Admin)
      description: |
        Sigue la misma política que la baja completa de un docente (RF-02.8/02.10):
        si con esto la materia queda sin ningún otro docente ACTIVO, se cancelan sus
        reservas futuras y se notifica a todos los Admin; si conserva otro docente,
        no se cancela nada.

        La cancelación ocurre ANTES de quitar la asignación: si falla, la asignación
        se conserva y la operación se puede reintentar.
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: materiaId
          required: true
          schema: { type: string, format: uuid }
        - in: path
          name: docenteMateriaId
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Asignación removida
          content:
            application/json:
              schema:
                type: object
                properties:
                  reservasCanceladas:
                    type: integer
                    description: 0 si la materia conserva otro docente activo.

  # ══════════════════════════════
  # INVENTORY
  # ══════════════════════════════
  /api/inventory/carros:
    get:
      tags: [inventory]
      summary: Listar carros (cualquier usuario autenticado)
      description: |
        Visible para ADMIN y DOCENTE por igual — un docente necesita ver estado,
        freezado y softwareInstalado (ej. versión de AutoCAD) de cada PC para elegir
        cuáles reservar.
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/Carro' } }
    post:
      tags: [inventory]
      summary: Crear carro (Admin)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nombre]
              properties:
                nombre: { type: string }
                descripcion: { type: string }
      responses:
        "201": { description: Carro creado }

  /api/inventory/carros/{id}:
    patch:
      tags: [inventory]
      summary: Editar carro (Admin)
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                nombre: { type: string }
                descripcion: { type: string }
      responses:
        "200": { description: Carro actualizado }

  /api/inventory/carros/{carroId}/equipos:
    get:
      tags: [inventory]
      summary: Listar los equipos de un carro (RF-03.7, todos los usuarios autenticados)
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: carroId
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Equipo' }
    post:
      tags: [inventory]
      summary: Registrar un equipo en un carro (RF-03.2, Admin)
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: carroId
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [identificador, numeroSerie]
              properties:
                identificador: { type: integer, example: 27 }
                numeroSerie: { type: string, maxLength: 50, example: "5CD1234ABC", description: "Número de serie de fábrica, único en toda la institución. Alfanumérico: se guarda en mayúsculas y sin espacios al borde, así que la respuesta puede diferir de lo enviado" }
                freezado: { type: boolean, default: false, description: "Informativo: tiene Deep Freeze instalado" }
                cpu: { type: string }
                ram: { type: string }
                sistemaOperativo: { type: string }
                softwareInstalado: { type: string }
      responses:
        "201": { description: PC registrada }
        "409": { description: Ya existe una PC con ese identificador en el carro, o el número de serie ya está registrado en otra PC }

  /api/inventory/equipos:
    get:
      tags: [inventory]
      summary: Listar el inventario, entero o solo lo que no está en ningún carro (RF-03.15, todos los usuarios autenticados)
      description: |
        Sin filtro devuelve todo el inventario, que es lo que necesita una
        pantalla que ofrezca lo prestable sin recorrer carro por carro.

        Con `enCarro=false`, solo el proyector, los cargadores, las notebooks
        sueltas. Solo se reconoce el valor exacto `false`: cualquier otra cosa
        devuelve el inventario entero, porque de un filtro mal escrito es
        mejor ver de más que de menos — ver de menos se confunde con "no hay
        ninguno".

        Lo ve cualquier autenticado por el mismo motivo que los carros y sus
        equipos (RF-03.7): un docente necesita saber que existe un proyector
        antes de pedirlo.

        Los equipos sueltos comparten entidad —y esquema de respuesta— con las
        computadoras de carro, y eso es deliberado: "qué hay afuera del
        laboratorio" (RF-08) tiene que ser una sola lista.

        La condición va en la query y no en el path: un segmento literal como
        `/equipos/sueltos` obliga a registrarlo antes que `/{id}` o el
        parámetro se lo traga, y es una trampa que compila, arranca y falla en
        tiempo de ejecución.
      security: [{ bearerAuth: [] }]
      parameters:
        - in: query
          name: enCarro
          required: false
          schema: { type: string, enum: ["false"] }
          description: "`false` deja solo los equipos que no pertenecen a ningún carro."
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Equipo' }
    post:
      tags: [inventory]
      summary: Registrar un equipo suelto (RF-03.15, Admin)
      description: |
        A qué colección se hace POST decide dónde nace el equipo: acá nace
        suelto, en `/carros/{carroId}/equipos` nace adentro de ese carro.

        Son dos colecciones y no una con un campo opcional porque lo que se
        carga es distinto: acá no hay carro, ni identificador, ni número de
        serie, y lo que identifica al equipo es el nombre.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tipo, nombre]
              properties:
                tipo: { type: string, maxLength: 50, example: "PROYECTOR", description: "Texto libre: la lista de cosas que presta una escuela no es la de otra. El formulario sugiere los tipos ya cargados" }
                nombre: { type: string, maxLength: 100, example: "Proyector Epson", description: "Único entre los equipos sueltos, sin distinguir mayúsculas" }
                reservable: { type: boolean, default: false, description: "Marcar solo lo que alguien pueda querer planificar. Por defecto false: un cargador se presta en el momento y aparecería como ruido cada vez que un docente va a reservar" }
      responses:
        "201":
          description: Equipo registrado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Equipo' }
        "400": { description: Falta el tipo o el nombre, o exceden el largo }
        "409": { description: Ya hay otro equipo suelto con ese nombre }

  /api/inventory/equipos/{id}:
    patch:
      tags: [inventory]
      summary: Editar datos de un equipo, incluyendo moverlo de carro (Admin)
      description: |
        Sirve para los dos tipos de equipo, pero no todos los campos aplican a
        los dos: `carroId` y los de hardware son de una computadora de carro;
        `tipo`, `nombre` y `reservable` (RF-03.18) son de un equipo suelto.

        Quitar `reservable` NO cancela nada: el equipo deja de ofrecerse al
        armar una reserva, pero las que ya existen siguen en pie.
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                carroId: { type: string, format: uuid, description: "Mueve el equipo a otro carro (RF-03.10). El identificador debe seguir siendo único en el carro destino." }
                freezado: { type: boolean }
                cpu: { type: string }
                ram: { type: string }
                sistemaOperativo: { type: string }
                softwareInstalado: { type: string }
                tipo: { type: string, maxLength: 50, description: "RF-03.15" }
                nombre: { type: string, maxLength: 100, description: "RF-03.15. En un equipo suelto no puede quedar vacío: es lo único que lo distingue. En una computadora de carro sí, porque ahí no cumple ninguna función" }
                reservable: { type: boolean, description: "RF-03.16" }
      responses:
        "200": { description: PC actualizada }
        "400": { description: Tipo o nombre vacíos o demasiado largos }
        "409": { description: Ya existe una PC con ese identificador en el carro destino, o el número de serie ya está registrado en otra PC }
    delete:
      tags: [inventory]
      summary: Dar de baja un equipo del inventario (Admin)
      description: |
        Soft delete: marca dado_de_baja=true y fecha_baja. No se borra la fila —
        incidencia y reserva la referencian por FK y ese historial se conserva.
        El equipo deja de listarse como disponible y no puede reservarse.
        Dispara la misma cascada de cancelación que el cambio de estado a
        FUERA_DE_SERVICIO (RF-03.9): cancela sus reservas futuras y notifica a
        los docentes afectados.

        **Un equipo prestado no se puede dar de baja**: devuelve 409. Dejaría el
        préstamo abierto sin ninguna pantalla desde donde cerrarlo. Hay que
        marcar primero que volvió. Cambiar el ESTADO sí se permite estando
        prestado — llevarle una máquina al técnico es justamente un préstamo.
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Equipo dado de baja, con el detalle de la cascada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ResultadoCascada' }
        "409":
          description: El equipo ya estaba dado de baja, o está prestado y todavía no volvió
          content:
            text/plain:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /api/inventory/equipos/{id}/estado:
    patch:
      tags: [inventory]
      summary: Cambiar estado de un equipo (Admin)
      description: |
        Al pasar a EN_MANTENIMIENTO o FUERA_DE_SERVICIO, cancela en cascada todas las
        reservas CONFIRMADA futuras de esa PC y notifica a cada docente afectado (RF-03.6).
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [estado]
              properties:
                estado: { type: string, enum: [DISPONIBLE, EN_MANTENIMIENTO, FUERA_DE_SERVICIO] }
                motivo:
                  type: string
                  nullable: true
                  description: "Opcional. Si se omite y el estado cancela reservas, se usa un mensaje por defecto."
      responses:
        "200":
          description: Estado actualizado, con el detalle de la cascada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ResultadoCascada' }

  /api/reservation/equipos/{equipoId}/calendario:
    get:
      tags: [inventory]
      summary: Calendario de disponibilidad de un equipo (todos los usuarios autenticados)
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
        - in: query
          name: desde
          required: true
          schema: { type: string, format: date }
        - in: query
          name: hasta
          required: true
          schema: { type: string, format: date }
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Reserva' }

  /api/inventory/incidencias:
    post:
      tags: [inventory]
      summary: Registrar incidencia sobre un equipo
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [equipoId, descripcion, gravedad]
              properties:
                equipoId: { type: string, format: uuid }
                descripcion: { type: string }
                categoria:
                  type: string
                  maxLength: 50
                  description: |
                    Opcional (RF-03.5): quien reporta no siempre sabe qué
                    falla. Texto libre; conviene tomarla de
                    `/api/inventory/categorias-de-falla` para no crear
                    variantes de una categoría que ya existe.
                  example: batería
                gravedad: { type: string, enum: [LEVE, MODERADA, GRAVE] }
      responses:
        "201": { description: Incidencia registrada }
        "400": { description: La categoría supera los 50 caracteres }

  /api/inventory/incidencias/{id}:
    patch:
      tags: [inventory]
      summary: Actualizar estado de incidencia (Admin)
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                estado: { type: string, enum: [ABIERTA, EN_REPARACION, ENVIADA_A_SOPORTE, RESUELTA] }
                categoria:
                  type: string
                  maxLength: 50
                  description: |
                    Clasificar después una falla que se reportó sin
                    diagnosticar. Mandarla vacía la devuelve a "sin
                    clasificar"; omitir el campo la deja como está.
                enviadoDGE: { type: boolean }
                fechaEnvioDGE: { type: string, format: date-time }
      responses:
        "200": { description: Incidencia actualizada }

  /api/reservation/reservas/{id}/equipo:
    patch:
      tags: [reservation]
      summary: Cambiar una reserva de computadora (RF-08.14)
      description: |
        Mueve la reserva a otra máquina libre en la misma franja, sin tocar
        fecha ni horario: es la misma clase.

        Existe porque la alternativa —cancelar esa PC y crear otra reserva—
        arma un ReservaGrupo nuevo, así que el docente terminaba con la misma
        clase mostrada como dos tarjetas separadas en "Mis reservas".

        Es de quien tenga la reserva, o de un Admin. Solo se puede cambiar
        una reserva CONFIRMADA: una cancelada, finalizada o liberada por no
        retiro ya no reserva nada.

        Si la reserva pertenece a una serie recurrente, `alcance` decide hasta
        dónde llega el cambio — la misma pregunta que hace la cancelación
        (RF-04.6). Con ESTA_Y_SIGUIENTES se validan **todas** las ocurrencias
        que faltan antes de tocar ninguna: si el equipo nuevo choca en alguna
        fecha no se cambia nada y el 409 dice en cuál. Cambiar catorce martes y
        fallar en el decimoquinto dejaría la serie repartida entre dos máquinas
        sin que nadie lo pidiera.
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [equipoId]
              properties:
                equipoId: { type: string, format: uuid, description: "La máquina nueva. Tiene que estar DISPONIBLE y libre en esa franja." }
                alcance:
                  type: string
                  enum: [SOLO_ESTA, ESTA_Y_SIGUIENTES]
                  default: SOLO_ESTA
                  description: |
                    Solo tiene efecto si la reserva pertenece a una serie recurrente; en una
                    reserva suelta, ESTA_Y_SIGUIENTES no cambia nada respecto de SOLO_ESTA.
                    El alcance llega hasta el final de la serie y nunca toca ocurrencias
                    pasadas: lo que ya se dio no se reescribe.
      responses:
        "200":
          description: |
            Reserva actualizada. Con ESTA_Y_SIGUIENTES devuelve la ocurrencia sobre la
            que se pidió el cambio; las demás se cambiaron en la misma transacción.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Reserva' }
        "400": { description: Falta la PC nueva, o el alcance no es uno de los dos valores }
        "403": { description: La reserva es de otra persona y quien pide no es Admin }
        "404": { description: La reserva no existe }
        "409": { description: "La reserva ya no está vigente, o la PC nueva no está disponible o ya tiene reserva en esa franja. Con ESTA_Y_SIGUIENTES el mensaje nombra la fecha del choque y no se cambia ninguna ocurrencia" }

  /api/reservation/prestamos:
    get:
      tags: [reservation]
      summary: Qué computadoras están afuera del laboratorio (Admin)
      description: |
        Los préstamos sin devolver, ordenados por hora de devolución: lo que
        debía haber vuelto hace más tiempo va primero, y lo que no tiene hora
        pactada al final.

        Solo Admin, incluida esta lectura. Que un docente pudiera consultar y
        marcarse entregas convertiría el registro en una declaración en vez
        de en una constancia.
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Listado
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Prestamo' }
    post:
      tags: [reservation]
      summary: Entregar computadoras sin reserva detrás (Admin)
      description: |
        El préstamo espontáneo: "necesito una compu para hacer un trámite".

        Quien la recibe NO necesita tener cuenta —secretaría, preceptoría, un
        alumno—, así que `nombre` es obligatorio y `usuarioId` opcional.

        Si alguna PC ya está afuera, se informa en `noEntregadas` y el resto
        sale igual: el Admin tiene las otras máquinas en la mano, y hacerlo
        empezar de nuevo por una sola sería peor.

        `avisos` trae las reservas próximas de las máquinas entregadas. No
        impidió nada: el sistema no sabe cuánto va a durar un trámite.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [equipoIds, nombre]
              properties:
                equipoIds:
                  type: array
                  minItems: 1
                  items: { type: string, format: uuid }
                nombre: { type: string, maxLength: 200, example: "Marta (secretaría)" }
                usuarioId: { type: string, format: uuid }
                motivo: { type: string, example: "trámite" }
                devolucionEstimada: { type: string, format: date-time, description: "Opcional. Sin ella no se le reclama la devolución." }
      responses:
        "201":
          description: Lote procesado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ResultadoEntrega' }
        "400": { description: Sin equipos o sin nombre }

  /api/reservation/prestamos/por-reserva:
    post:
      tags: [reservation]
      summary: Entregar las computadoras de una reserva (Admin)
      description: |
        Se mandan las Reserva puntuales (una por PC), no el grupo: el retiro
        es máquina por máquina, porque el docente puede llevarse tres de las
        cinco que reservó — y las otras dos siguen disponibles para otro.

        La hora en que deben volver sale del fin de la reserva; no se manda.

        Responde 200 aunque alguna PC no haya salido; qué pasó con cada una
        está en `noEntregadas`. Un 409 obligaría a la pantalla a deshacer las
        que sí se entregaron, que ya están en manos del docente.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reservaIds]
              properties:
                reservaIds:
                  type: array
                  minItems: 1
                  items: { type: string, format: uuid }
                retiradoPor:
                  type: string
                  maxLength: 200
                  example: "Juan (alumno de 5°A)"
                  description: |
                    Quién vino físicamente a buscarlas, si no fue el docente
                    de la reserva. Es opcional: hay instituciones que quieren
                    poder reconstruir quién pasó por el mostrador y otras a
                    las que ese dato les sobra.

                    NO cambia de quién es la responsabilidad. El préstamo
                    queda a nombre del docente y atado a su cuenta, porque él
                    reservó y a él se le reclama si los equipos no vuelven;
                    quien los retira muchas veces ni siquiera tiene cuenta en
                    el sistema. Ver RF-08.19.
      responses:
        "200":
          description: Lote procesado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ResultadoEntrega' }
        "400": { description: Sin reservas indicadas }
        "404": { description: Alguna de las reservas no existe }

  /api/reservation/prestamos/recibir:
    post:
      tags: [reservation]
      summary: Registrar que las computadoras volvieron (Admin)
      description: |
        Devolver tres de cuatro no necesita nada especial: la cuarta sigue
        figurando afuera.

        Recibir dos veces la misma máquina no corta nada —pasa con dos Admin
        en el mostrador o un doble clic— y se informa en `noRecibidos`: lo
        que el Admin quería, que la máquina figure adentro, ya pasó.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [prestamoIds]
              properties:
                prestamoIds:
                  type: array
                  minItems: 1
                  items: { type: string, format: uuid }
                observaciones:
                  type: string
                  example: "volvió sin el cargador"
                  description: |
                    Se guarda en TODAS las del lote. Si es sobre una sola
                    máquina, conviene recibirla aparte: atarla a cinco filas
                    diría de las otras cuatro algo que no pasó.
      responses:
        "200":
          description: Lote procesado
          content:
            application/json:
              schema:
                type: object
                properties:
                  recibidos:
                    type: array
                    items: { $ref: '#/components/schemas/Prestamo' }
                  noRecibidos:
                    type: array
                    items:
                      type: object
                      properties:
                        prestamoId: { type: string, format: uuid }
                        detalle: { type: string }
        "400": { description: Sin préstamos indicados }
        "404": { description: Alguno de los préstamos no existe }

  /api/reservation/equipos/{equipoId}/prestamos:
    get:
      tags: [reservation]
      summary: Historial de entregas de una computadora (Admin)
      description: |
        De lo más reciente a lo más viejo. Sobrevive al archivado del ciclo
        lectivo: al borrarse las reservas (RF-02.4) el préstamo queda sin
        reserva asociada, pero el registro de quién se llevó la máquina vale
        por sí mismo.
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: equipoId
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Listado
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Prestamo' }

  /api/inventory/licencias:
    get:
      tags: [inventory]
      summary: Listar todas las licencias de software con su ubicación (Admin)
      description: |
        Solo Admin, incluida la lectura: el docente elige PC por
        `softwareInstalado`, que ya ve en la pantalla de reserva.

        Sin paginar, como el resto de los listados acotados por el dominio
        (ciclos, cursos, carros): la cantidad la limita el inventario, no el uso.

        Vienen ordenadas para la pantalla: primero las que no tienen fecha
        —hay que ir a mirar la máquina—, después de la más vencida a la que
        más le falta.
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Listado
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Licencia' }
    post:
      tags: [inventory]
      summary: Cargar la misma licencia en varios equipos (Admin)
      description: |
        Alta masiva: el caso real es "AutoCAD, 30 días, en estas ocho máquinas",
        de uno o de varios carros.

        Una PC que ya tiene esa licencia se **saltea y se informa**, no aborta
        el lote. Eso hace que el request sea REINTENTABLE: si algo falla en la
        PC número seis, volver a mandarlo completa lo que falta sin duplicar lo
        que ya entró. Por eso responde 201 aunque haya salteado algunas — un
        409 obligaría a la pantalla a deshacer lo que sí se creó.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - type: object
                  required: [equipoIds, nombre, diasDuracion]
                  properties:
                    equipoIds:
                      type: array
                      minItems: 1
                      items: { type: string, format: uuid }
                    nombre: { type: string, maxLength: 100, example: "AutoCAD 2027" }
                    diasDuracion: { type: integer, minimum: 1, maximum: 3650, example: 30 }
                    diasAviso: { type: integer, minimum: 0, maximum: 365, default: 1 }
                - $ref: '#/components/schemas/VencimientoDeclarado'
      responses:
        "201":
          description: Lote procesado
          content:
            application/json:
              schema:
                type: object
                properties:
                  creadas:
                    type: array
                    items: { $ref: '#/components/schemas/Licencia' }
                  equiposQueYaLaTenian:
                    type: array
                    items: { type: string, format: uuid }
                    description: "No es un error: marcar todo un carro cuando algunas ya estaban cargadas tiene que funcionar."
        "400": { description: Sin equipos, nombre o días inválidos, o vencimiento declarado de más de una forma }

  /api/inventory/licencias/renovar:
    post:
      tags: [inventory]
      summary: Renovar varias licencias de una vez (Admin)
      description: |
        Es POST sobre un sub-recurso y no PATCH sobre cada licencia porque
        renovar ocho máquinas es UNA acción: partirla en ocho requests dejaría
        la pantalla con cuatro renovadas y cuatro no si se corta la conexión.

        Las que todavía no tienen vencimiento cargado NO se renuevan: se
        informan en `sinFechaPrevia`. Renovar mueve un contador que ya existe;
        cargar la fecha por primera vez se hace con el PATCH, donde hay que
        decir CÓMO se sabe. Sin esa guarda, "Renovar" sería la forma fácil de
        sacarse de encima una licencia sin verificar poniéndole días que nadie
        confirmó.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [licenciaIds]
              properties:
                licenciaIds:
                  type: array
                  minItems: 1
                  items: { type: string, format: uuid }
                renovadaEl:
                  type: string
                  format: date
                  description: |
                    Ausente = hoy, el caso normal. Con fecha, es el del olvido:
                    se renovaron el martes y se cargan el jueves. El contador
                    arranca en la fecha real, no en la de la carga.
      responses:
        "200":
          description: Lote procesado
          content:
            application/json:
              schema:
                type: object
                properties:
                  renovadas:
                    type: array
                    items: { $ref: '#/components/schemas/Licencia' }
                  sinFechaPrevia:
                    type: array
                    items: { type: string, format: uuid }
        "400": { description: Sin licencias indicadas }
        "404": { description: Alguna de las licencias no existe }

  /api/inventory/licencias/{id}:
    patch:
      tags: [inventory]
      summary: Editar una licencia, incluido su vencimiento (Admin)
      description: |
        El "editar el contador en cualquier momento" de RF-03.13: corregir una
        fecha que quedó mal, cambiar la duración de 30 a 60 días, o cargar por
        primera vez el vencimiento de una licencia dada de alta sin él.

        Cambiar `diasDuracion` **no mueve** el vencimiento vigente: la licencia
        instalada hoy se compró con las condiciones viejas y sigue venciendo
        cuando vencía; lo que cambia es cuánto durará la próxima renovación.
        Para recalcularlo ahora hay que mandar además `renovadaEl` con la
        última renovación conocida — explícito, no como efecto colateral.
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        content:
          application/json:
            schema:
              allOf:
                - type: object
                  properties:
                    nombre: { type: string, maxLength: 100 }
                    diasDuracion: { type: integer, minimum: 1, maximum: 3650 }
                    diasAviso: { type: integer, minimum: 0, maximum: 365 }
                - $ref: '#/components/schemas/VencimientoDeclarado'
      responses:
        "200": { description: Licencia actualizada }
        "400": { description: Datos inválidos, o vencimiento declarado de más de una forma }
        "404": { description: La licencia no existe }
        "409": { description: Esa PC ya tiene otra licencia con ese nombre }
    delete:
      tags: [inventory]
      summary: Quitar una licencia (Admin)
      description: |
        Borrado real, no baja lógica: de una licencia no cuelga nada —ni
        reservas, ni incidencias, ni historial— así que conservarla solo
        dejaría ruido en la pantalla.
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204": { description: Licencia eliminada }
        "404": { description: La licencia no existe }

  /api/inventory/equipos/{equipoId}/licencias:
    get:
      tags: [inventory]
      summary: Licencias de un equipo puntual (Admin)
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: equipoId
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Listado
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Licencia' }

  # ══════════════════════════════
  # RESERVATIONS
  # ══════════════════════════════
  /api/inventory/materias-en-uso:
    get:
      tags: [inventory]
      summary: Nombres de materia que ya existen (Admin)
      description: |
        Alimenta el selector con el que se marca una preferencia (RF-03.21). Son los
        nombres **distintos** que existen en el sistema, sin importar el curso ni el
        ciclo — "Matemáticas" aparece una vez, no una por cada 1°A, 2°B…

        Existe para que el Admin ELIJA en vez de tipear: la marca se guarda como texto,
        y este selector es lo único que impide que "Matemática" y "Matematica" nazcan
        como dos marcas distintas. Las variantes que sólo difieren en acentos o
        mayúsculas se colapsan en una sola opción.

        Incluye las materias de ciclos archivados: una marca del inventario sobrevive al
        cierre del ciclo, así que la lista para editarla tiene que seguir mostrando ese
        nombre.
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Listado
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { type: string }, example: ["Dibujo Técnico", "Matemática"] }

  /api/inventory/equipos/{equipoId}/preferencias:
    get:
      tags: [inventory]
      summary: Para qué materias es preferente un equipo
      description: |
        Las marcas de preferencia de ese equipo (RF-03.21), de la prioridad más fuerte
        a la más débil.

        **No es solo-Admin**, a diferencia de las licencias: la marca es lo que explica
        por qué la lista al reservar viene ordenada como viene, y el docente ya ve ese
        orden. Esconderle el motivo lo deja adivinando.
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: equipoId
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Listado
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/PreferenciaDeEquipo' } }

  /api/inventory/preferencias:
    post:
      tags: [inventory]
      summary: Marcar la misma preferencia en varios equipos (Admin)
      description: |
        La misma marca aplicada a un lote de equipos (RF-03.21): el caso real es "estas
        ocho PCs son las de Dibujo Técnico". De a una serían ocho recorridas por el
        mismo formulario.

        Responde **201 aunque alguna ya estuviera marcada**; cuáles se saltearon viene
        en `equiposQueYaLaTenian`, con el mismo criterio que el alta de licencias. Al
        marcar un carro entero es esperable que alguna máquina ya lo estuviera, y
        abortar el lote obligaría al Admin a averiguar cuál y destildarla. Eso hace que
        reintentar el mismo request sea seguro.

        **No toca ninguna reserva ni consulta si las hay.** La marca sólo ordena la
        lista al reservar, así que marcar un equipo con reservas ya hechas no tiene
        conflicto posible.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [equipoIds, materiaNombre]
              properties:
                equipoIds: { type: array, items: { type: string, format: uuid } }
                materiaNombre:
                  type: string
                  maxLength: 100
                  description: "Elegido de /api/inventory/materias-en-uso. El cruce ignora acentos y mayúsculas"
                anio:
                  type: integer
                  minimum: 1
                  maximum: 6
                  description: "Opcional — ausente vale para toda materia con ese nombre, en cualquier curso"
                division:
                  type: string
                  pattern: "^[A-Za-z]$"
                  description: "Opcional — ausente vale para todas las divisiones de ese año. Sin `anio` es un 400: no existen 'todas las B'"
                prioridad:
                  type: integer
                  minimum: 1
                  maximum: 9
                  default: 1
                  description: "1 es la más fuerte. Ausente = 1, que es lo que espera quien marca una sola máquina y no piensa en escalones"
      responses:
        "201":
          description: Lote procesado
          content:
            application/json:
              schema:
                type: object
                properties:
                  creadas: { type: array, items: { $ref: '#/components/schemas/PreferenciaDeEquipo' } }
                  equiposQueYaLaTenian: { type: array, items: { type: string, format: uuid }, description: "Los que ya tenían esa misma marca con ese mismo alcance" }
        "400": { description: Materia vacía, año o división fuera de rango, división sin año, prioridad fuera de rango, o lista de equipos vacía }
        "403": { description: Solo ADMIN }

  /api/inventory/preferencias/{id}:
    patch:
      tags: [inventory]
      summary: Corregir el alcance y la prioridad de una marca (Admin)
      description: |
        **La materia no se edita**: apuntar a otra es otra marca, no una corrección de
        esta. Dejarla editable haría que "corregir el año" y "cambiar de materia" fueran
        la misma operación, y sólo la primera es una corrección.

        Los campos ausentes se interpretan como "sin acotar": mandar el cuerpo sin
        `anio` deja la marca valiendo para toda materia con ese nombre.
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                anio: { type: integer, minimum: 1, maximum: 6 }
                division: { type: string, pattern: "^[A-Za-z]$" }
                prioridad: { type: integer, minimum: 1, maximum: 9, default: 1 }
      responses:
        "200":
          description: Marca actualizada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PreferenciaDeEquipo' }
        "400": { description: Alcance o prioridad inválidos }
        "403": { description: Solo ADMIN }
        "404": { description: La marca no existe }
        "409": { description: El equipo ya tiene otra marca igual con ese mismo alcance }
    delete:
      tags: [inventory]
      summary: Quitar una marca de preferencia (Admin)
      description: |
        Devuelve el equipo al orden neutral. **No hay ninguna cascada que avisar ni nada
        que confirmar**: la marca sólo ordenaba la lista, así que sacarla no afecta
        ninguna reserva.
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204": { description: Marca quitada }
        "403": { description: Solo ADMIN }
        "404": { description: La marca no existe }

  /api/reservation/equipos-disponibles:
    get:
      tags: [reservations]
      summary: Qué se puede tildar y qué está tomado en un horario dado
      description: |
        Devuelve equipos de todos los carros por defecto — un docente puede combinar
        equipos de carros distintos en la misma reserva (no hay restricción de "un solo
        carro por ReservaGrupo"), más los equipos sueltos marcados como reservables.
        El filtro carroId es opcional, para ver solo los de un carro puntual. Excluye
        los dados de baja, los que no están DISPONIBLE y los no reservables.

        Responde las dos mitades de la franja (RF-04.11): `data` son los libres, para
        tildar, y `ocupados` los que ya tiene alguien, con quién los tiene. Los ocupados
        no son un extra: sin ellos, "no hay nada libre" y "los tiene alguien con quien
        puedo hablar" se ven igual en pantalla, y solo la segunda tiene salida. No
        cuestan una consulta más — saber qué está libre ya exige leer las reservas y
        bloqueos que pisan la franja.

        Los equipos que no están DISPONIBLE, los no reservables y los dados de baja no
        aparecen en ninguna de las dos listas: no los tiene nadie a quien pedírselos.
      security: [{ bearerAuth: [] }]
      parameters:
        - in: query
          name: fecha
          required: true
          schema: { type: string, format: date }
        - in: query
          name: horaInicio
          required: true
          schema: { type: string, example: "10:00" }
        - in: query
          name: horaFin
          required: true
          schema: { type: string, example: "11:30" }
        - in: query
          name: carroId
          schema: { type: string, format: uuid, description: "Opcional — filtra a un solo carro si se especifica" }
        - in: query
          name: materiaId
          schema: { type: string, format: uuid }
          description: |
            Opcional — para qué materia se ordena la lista (RF-03.21). La lista no tiene
            un orden único: los equipos marcados como preferentes de esa materia van
            arriba, los que prefiere otra van al final, y el resto en el medio. Sin este
            parámetro —un Admin que reserva sin materia— sale el orden de siempre y todo
            viene con `tramo: NEUTRAL`. Con `serieDesdeGrupoId` no hace falta: la materia
            se saca del propio grupo.
        - in: query
          name: serieDesdeGrupoId
          schema: { type: string, format: uuid }
          description: |
            Opcional, para cambiar la máquina de una serie completa (RF-08.14). Con este
            parámetro, `data` son los equipos libres en **todas** las fechas que le quedan
            a la serie de ese grupo, no solo en la franja consultada. Ofrecer los libres de
            hoy y rechazar el cambio después, cuando choca en la tercera fecha, es hacerle
            adivinar al docente. Los `ocupados` siguen siendo los de la franja consultada.
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    description: |
                      Libres en esa franja: son los que se pueden tildar. Vienen **ya
                      ordenados** por tramo de preferencia (RF-03.21); `tramo` y `motivo`
                      existen para poder titular los bloques y explicar el orden, no para
                      reordenar del lado del cliente.
                    items:
                      allOf:
                        - $ref: '#/components/schemas/Equipo'
                        - type: object
                          properties:
                            tramo:
                              type: string
                              enum: [PREFERENTE, NEUTRAL, DE_OTRA_MATERIA]
                              description: "En qué bloque cae para la materia consultada. No es un permiso: los tres se pueden reservar igual"
                            motivo:
                              type: string
                              example: "Preferente para Matemática de 3°B"
                              description: "Por qué está en ese bloque, ya redactado. Ausente en un equipo neutral"
                  ocupados: { type: array, items: { $ref: '#/components/schemas/EquipoOcupado' }, description: "Tomados en esa franja, con quién los tiene. No se tildan" }

  /api/reservation/reservas/{id}/pedido-de-liberacion:
    post:
      tags: [reservation]
      summary: Pedirle a quien tiene la reserva que libere ese equipo (RF-04.12)
      description: |
        Le manda al dueño de la reserva un aviso interno con copia por correo: quién
        pide, para qué materia, qué equipo, de qué franja y un texto libre opcional.

        **No cambia ninguna reserva.** Es un mensaje, no una operación sobre los datos:
        nada queda tomado a la espera de respuesta y quien pide no gana prioridad si el
        equipo se libera. Si el dueño accede, libera con lo que ya existe — cambia el
        equipo por otro libre (PATCH /reservas/{id}/equipo) o cancela esa reserva.

        No hay aceptar ni rechazar. Un pedido con estado obliga a resolver qué pasa si
        el dueño acepta y otro ya tomó el equipo, cuándo caduca sin respuesta y qué se
        ve mientras tanto: mucha maquinaria para intermediar un acuerdo que se cierra
        hablando. Lo que el sistema garantiza es lo único que el pasillo no puede — que
        el pedido llegue.

        El correo del dueño no se expone: el envío lo hace el servidor.
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
          description: "La Reserva (equipo puntual) que se pide, no el grupo"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                mensaje: { type: string, maxLength: 500, description: "Opcional. Para qué lo necesita, en palabras del que pide. Viaja tal cual al aviso y al correo" }
      responses:
        "202":
          description: |
            Pedido enviado. Es 202 y no 201 porque no se crea ningún recurso que el
            cliente pueda después consultar o borrar: lo único que queda es la
            notificación del otro lado.
        "400": { description: El mensaje excede el máximo }
        "403": { description: La reserva es propia — no hay a quién pedirle }
        "404": { description: La reserva no existe }
        "409": { description: "Ya se pidió por esa reserva hoy; o la reserva no está CONFIRMADA; o su franja ya empezó; o es un bloqueo administrativo, que no tiene docente a quien pedirle" }

  /api/reservation/reservas:
    get:
      tags: [reservations]
      summary: Listar reservas agrupadas (propias si Docente, todas si Admin)
      security: [{ bearerAuth: [] }]
      parameters:
        - in: query
          name: desde
          schema: { type: string, format: date }
        - in: query
          name: hasta
          schema: { type: string, format: date }
        - in: query
          name: equipoId
          schema: { type: string, format: uuid }
        - in: query
          name: materiaId
          schema: { type: string, format: uuid }
        - in: query
          name: estado
          schema: { type: string, enum: [CONFIRMADA, PARCIALMENTE_CANCELADA, CANCELADA, FINALIZADA, NO_RETIRADA] }
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/pageSize'
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/ReservaGrupo' } }
                  meta: { $ref: '#/components/schemas/PaginationMeta' }
        "400": { description: page o pageSize inválidos }
    post:
      tags: [reservations]
      summary: Crear reserva (uno o varios equipos en un solo grupo)
      description: |
        Operación transaccional: si alguna PC del arreglo tiene solapamiento, no se
        confirma ninguna — la respuesta 409 detalla qué PC(s) puntual(es) fallaron
        para que el usuario las destilde y reintente con el resto.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReservaRequest' }
      responses:
        "201":
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReservaGrupo' }
        "400":
          description: |
            Fecha o rango horario rechazados: un bloque que ya terminó, una duración
            mayor a 8 horas (un turno completo), o un día y horario fuera de la
            jornada declarada por la institución (ver GET /api/jornada). Sin jornada
            declarada, cualquier día y horario se aceptan.

            Una horaFin MENOR que horaInicio no es un error: significa que la
            reserva termina al día siguiente (22:00–01:00 es una clase nocturna de
            tres horas). Lo que se rechaza es que sean iguales.
        "403": { description: Sin permiso para reservar en esa materia }
        "409":
          description: |
            Una o más PCs elegidas tienen solapamiento — no se crea ninguna.

            El cuerpo es texto plano (el backend usa el ErrorHandler por
            defecto de Fiber, ver ErrorResponse), pero nombra el choque: qué
            equipo, qué día, qué franja y con quién. Con muchos conflictos se
            listan los primeros y el resto se resume en "y N más".
          content:
            text/plain:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /api/reservation/reservas/recurrentes:
    post:
      tags: [reservations]
      summary: Crear reserva recurrente (uno o varios equipos, valida todas las ocurrencias antes de crear)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReservaRecurrenteRequest' }
      responses:
        "201":
          content:
            application/json:
              schema:
                type: object
                properties:
                  reglaId: { type: string, format: uuid }
                  grupos:
                    type: array
                    description: Un ReservaGrupo por cada fecha materializada.
                    items: { $ref: '#/components/schemas/ReservaGrupo' }
        "409":
          description: |
            Una o más ocurrencias (fecha × PC) tienen solapamiento — no se crea
            ninguna. Cuerpo en texto plano, igual que el alta puntual.
          content:
            text/plain:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /api/reservation/grupos/{id}:
    get:
      tags: [reservations]
      summary: Ver el detalle de un grupo de reserva (con el estado de cada equipo)
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReservaGrupo' }

  /api/reservation/grupos/{id}/cancelar:
    post:
      tags: [reservations]
      summary: Cancelar un ReservaGrupo (RF-04.6)
      description: |
        `soloEsta: true` cancela únicamente esa fecha; `false` cancela esa y
        todas las ocurrencias futuras de la misma regla de recurrencia.
        Mismo criterio de motivo obligatorio que cancelar una Reserva ajena.
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                motivo: { type: string }
                soloEsta: { type: boolean, default: true }
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  reservasCanceladas: { type: integer }
        "403": { description: No es tu reserva y no sos Admin }

  /api/reservation/reservas/{id}/cancelar:
    post:
      tags: [reservations]
      summary: Cancelar la Reserva de un equipo puntual
      description: |
        Un docente solo puede cancelar las suyas; un Admin, cualquiera.
        RF-04.8: si la reserva es de otra persona el motivo es OBLIGATORIO
        (se rechaza con 400 si viene vacío) — ese texto es el que recibe el
        docente en la notificación (RF-05.1).

        No es un DELETE a propósito: dentro de un ciclo lectivo activo las
        reservas nunca se eliminan, se marcan CANCELADA (RF-04.9).
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid, description: "id de la Reserva puntual, no del grupo" }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                motivo: { type: string }
      responses:
        "200": { description: Cancelada. Si la canceló otra persona, el docente recibe la notificación con el motivo (RF-05.1) }
        "400": { description: Falta el motivo al cancelar una reserva ajena }
        "403": { description: No es tu reserva y no sos Admin }
        "404": { description: No encontrada }

  /api/reservation/bloqueos:
    post:
      tags: [reservations]
      summary: Bloquear equipos en un rango horario definido, indicando por qué (Admin)
      description: |
        Un Admin toma los equipos para otra cosa, por el motivo que sea.

        Cancela solo las Reserva puntuales en conflicto dentro del rango exacto — el
        resto de una recurrencia u otros equipos del mismo grupo siguen vigentes. Los
        grupos afectados pasan a PARCIALMENTE_CANCELADA o CANCELADA según corresponda.

        El motivo es texto libre y obligatorio: el sistema no puede prever por qué
        una institución se toma el laboratorio, y ese texto es el que lee el docente
        al que le cancelaron la clase.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BloqueoRequest' }
      responses:
        "201":
          content:
            application/json:
              schema:
                type: object
                properties:
                  bloqueos: { type: array, items: { $ref: '#/components/schemas/Reserva' } }
                  reservasCanceladas: { type: integer, description: "Reservas puntuales canceladas, no grupos completos" }
                  docentesNotificados: { type: integer }
        "400":
          description: |
            El bloque ya terminó. RF-04.7 tampoco tiene el tope de duración de una
            reserva normal: un bloqueo dura lo que el Admin decida — es excepcional
            por naturaleza.

  # ══════════════════════════════
  # NOTIFICATIONS
  # ══════════════════════════════
  /api/notifications:
    get:
      tags: [notifications]
      summary: Listar notificaciones del usuario autenticado
      security: [{ bearerAuth: [] }]
      parameters:
        - in: query
          name: estado
          schema: { type: string, enum: [NO_LEIDA, LEIDA] }
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/pageSize'
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/Notificacion' } }
                  meta: { $ref: '#/components/schemas/PaginationMeta' }
        "400": { description: page o pageSize inválidos }

  /api/notifications/{id}/leida:
    patch:
      tags: [notifications]
      summary: Marcar notificación como leída
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200": { description: Notificación marcada como leída }

  # ══════════════════════════════
  # REPORTS
  # ══════════════════════════════
  /api/reporting/ciclos/{cicloId}/uso-equipos:
    get:
      tags: [reports]
      summary: Reporte de uso por equipo (Admin)
      description: |
        `desde` y `hasta` son opcionales e independientes (RF-06.1): omitir los
        dos devuelve el ciclo entero. Los bloqueos administrativos cuentan como
        uso —ocupan el equipo igual— y se atan al ciclo por el año de la fecha,
        porque no tienen materia. Lo que NO cuenta es `NO_RETIRADA`: una clase
        que nadie fue a buscar no es una clase dada (RF-08.10).
      security: [{ bearerAuth: [] }]
      parameters:
        - in: query
          name: desde
          schema: { type: string, format: date }
        - in: query
          name: hasta
          schema: { type: string, format: date }
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        equipoId: { type: string, format: uuid }
                        etiqueta: { type: string, example: "PC 3", description: "Cómo se nombra el equipo (RF-03.17). Es lo que se muestra: los dos de abajo van en 0 y \"\" si no está en ningún carro" }
                        identificador: { type: integer }
                        carroNombre: { type: string }
                        minutosReservados: { type: integer }
                        cantidadReservas: { type: integer }

  /api/reporting/ciclos/{cicloId}/uso-docentes:
    get:
      tags: [reports]
      summary: Reporte de uso por docente (Admin)
      description: |
        Mismo rango opcional que uso-equipos, y mismo criterio de estados.

        `cantidadReservas` cuenta filas `reserva`, o sea equipos-hora: un
        docente que reservó ocho equipos para una clase suma ocho, no una.
      security: [{ bearerAuth: [] }]
      parameters:
        - in: query
          name: desde
          schema: { type: string, format: date }
        - in: query
          name: hasta
          schema: { type: string, format: date }
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        usuarioId:
                          type: string
                          format: uuid
                          description: |
                            Ausente si la cuenta se eliminó definitivamente
                            (RF-01.9). Sus horas siguen contando y el nombre
                            sobrevive congelado en la reserva; lo que no hay es
                            cuenta a la que apuntar. No sirve como clave única.
                        nombreDocente: { type: string }
                        cantidadReservas: { type: integer }
                        minutosReservados: { type: integer }

  /api/reporting/historico/{anio}/uso-equipos:
    get:
      tags: [reports]
      summary: Estadísticas de un ciclo lectivo ya archivado (Admin)
      description: |
        Lee de historico_uso_equipo / historico_uso_docente — el único origen de datos
        disponible para años archivados, ya que sus ReservaGrupo/Reserva se
        eliminaron físicamente al archivar (ver RF-02.4).
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: anio
          required: true
          schema: { type: integer, example: 2025 }
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  usoPorPc:
                    type: array
                    items:
                      type: object
                      properties:
                        equipoId: { type: string, format: uuid }
                        etiquetaSnapshot: { type: string, description: "Cómo se llamaba el equipo el día que se archivó el ciclo. Los dos de abajo van en 0 y \"\" si no estaba en ningún carro" }
                        identificadorSnapshot: { type: integer }
                        carroNombreSnapshot: { type: string }
                        minutosReservados: { type: integer }
                        cantidadReservas: { type: integer }
                  usoPorDocente:
                    type: array
                    items:
                      type: object
                      properties:
                        usuarioId: { type: string, format: uuid, nullable: true }
                        nombreDocenteSnapshot: { type: string }
                        cantidadReservas: { type: integer }
                        minutosTotales: { type: integer }
        "404": { description: No hay estadísticas archivadas para ese año }

  /api/reporting/incidencias/equipos:
    get:
      tags: [reports]
      summary: Incidencias agregadas por equipo (RF-06.3, Admin)
      description: |
        Devuelve el CONTEO por equipo, no las incidencias sueltas. Incluye lo
        que no está en ningún carro (015): al proyector también se le rompe la
        lámpara.
      security: [{ bearerAuth: [] }]
      parameters:
        - in: query
          name: desde
          schema: { type: string, format: date }
        - in: query
          name: hasta
          schema: { type: string, format: date }
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        equipoId: { type: string, format: uuid }
                        etiqueta: { type: string, example: "PC 3", description: "Cómo se nombra el equipo (RF-03.17). Es lo que se muestra: los dos de abajo van en 0 y \"\" si no está en ningún carro" }
                        identificador: { type: integer }
                        carroNombre: { type: string }
                        total: { type: integer }
                        abiertas: { type: integer }
                        enReparacion: { type: integer }
                        enviadasASoporte: { type: integer }
                        resueltas: { type: integer }
                        graves: { type: integer }

  # ══════════════════════════════
  # AVAILABILITY
  # ══════════════════════════════
  /api/jornada:
    get:
      tags: [availability]
      summary: Ver la jornada de la institución
      description: |
        Qué días y en qué horas abre la escuela (RF-07.5).

        La consulta cualquier usuario autenticado, no solo Admins: el formulario
        de reserva la usa para avisar antes de mandar, y el calendario para saber
        qué días dibujar.

        **Una lista vacía significa que todavía no se declaró la jornada, NO que
        la escuela esté cerrada.** Sin jornada declarada no hay restricción de día
        ni de horario. Una vez declarada, un día sin tramos es un día en que la
        escuela no abre.
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/BloqueHorarioAdmin' } }
    post:
      tags: [availability]
      summary: Agregar un tramo a la jornada (Admin)
      description: |
        Se pueden cargar varios tramos en el mismo día: una escuela con turno
        mañana y turno noche declara 07:00–12:00 y 18:00–23:00, y el mediodía
        queda cerrado. Una reserva tiene que entrar entera en un tramo.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [diaSemana, horaInicio, horaFin]
              properties:
                diaSemana: { type: string, enum: [LUNES, MARTES, MIERCOLES, JUEVES, VIERNES, SABADO, DOMINGO] }
                horaInicio: { type: string, example: "07:00" }
                horaFin: { type: string, example: "12:00" }
      responses:
        "201": { description: Tramo agregado }
        "409":
          description: |
            Ese tramo se pisa con otro del mismo día. El mensaje nombra cuál.
            Dos tramos que se tocan en el borde —uno termina 12:00 y el otro
            empieza 12:00— no se consideran solapados: describen un día abierto
            de punta a punta.
          content:
            text/plain:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /api/jornada/{id}:
    patch:
      tags: [availability]
      summary: Editar un tramo de la jornada (Admin)
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                diaSemana: { type: string, enum: [LUNES, MARTES, MIERCOLES, JUEVES, VIERNES, SABADO, DOMINGO] }
                horaInicio: { type: string, example: "07:00" }
                horaFin: { type: string, example: "12:00" }
      responses:
        "200": { description: Tramo actualizado }
        "400":
          description: |
            El tramo resultante empieza y termina a la misma hora. Que el fin
            sea MENOR que el inicio no es un error: significa que cierra al día
            siguiente (una nocturna declara 20:00–01:00), y la edición lo
            acepta igual que el alta. La validación de las dos tiene que ser la
            misma: pedir acá un fin posterior al inicio dejaría crear el tramo
            de una nocturna y no corregirlo nunca más.
          content:
            text/plain:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        "404": { description: No existe }
        "409": { description: Se pisa con otro tramo del mismo día }
    delete:
      tags: [availability]
      summary: Quitar un tramo de la jornada (Admin)
      description: |
        Quitar el último tramo deja la jornada sin declarar, y con eso el sistema
        vuelve a no restringir ningún día. Es coherente y reversible.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: Tramo eliminado }
        "404": { description: No existe }

  /api/availability/admins:
    get:
      tags: [availability]
      summary: Ver disponibilidad de todos los Admins (cualquier usuario autenticado)
      description: |
        Puramente informativo (RF-07.6) — no afecta ninguna otra funcionalidad.
        disponibleAhora se calcula en el momento contra el horario semanal y la
        excepción del día de hoy, si existe (la excepción siempre tiene prioridad).
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/AdminDisponibilidad' } }

  /api/availability/mi-horario:
    get:
      tags: [availability]
      summary: Ver mi propio horario semanal (Admin)
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/BloqueHorarioAdmin' } }
    post:
      tags: [availability]
      summary: Agregar un bloque a mi horario semanal (Admin)
      description: Aplica de inmediato para todas las semanas futuras (RF-07.3) — no requiere ninguna acción de "propagar".
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [diaSemana, horaInicio, horaFin]
              properties:
                diaSemana: { type: string, enum: [LUNES, MARTES, MIERCOLES, JUEVES, VIERNES, SABADO, DOMINGO] }
                horaInicio: { type: string, example: "08:00" }
                horaFin: { type: string, example: "12:00" }
      responses:
        "201": { description: Bloque agregado }
        "409":
          description: |
            Ese horario se pisa con otro bloque del mismo día (RF-07.7). El
            mensaje nombra cuál. Dos bloques que se tocan en el borde —uno
            termina 12:00 y el otro empieza 12:00— no se consideran solapados.
          content:
            text/plain:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /api/availability/mi-horario/{id}:
    patch:
      tags: [availability]
      summary: Editar un bloque de mi horario semanal (Admin)
      description: El cambio aplica desde ahora para todas las semanas futuras — no versiona el pasado, porque no hay nada materializado que preservar.
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                diaSemana: { type: string, enum: [LUNES, MARTES, MIERCOLES, JUEVES, VIERNES, SABADO, DOMINGO] }
                horaInicio: { type: string }
                horaFin: { type: string }
      responses:
        "200": { description: Bloque actualizado }
        "409":
          description: |
            Ese horario se pisa con otro bloque del mismo día (RF-07.7). El
            mensaje nombra cuál. Dos bloques que se tocan en el borde —uno
            termina 12:00 y el otro empieza 12:00— no se consideran solapados.
          content:
            text/plain:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
    delete:
      tags: [availability]
      summary: Eliminar un bloque de mi horario semanal (Admin)
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200": { description: Bloque eliminado }

  /api/availability/mi-excepcion:
    post:
      tags: [availability]
      summary: Cargar una excepción puntual (horario distinto o ausencia) para una fecha (Admin)
      description: |
        No afecta el patrón semanal general — solo esa fecha puntual (RF-07.4).
        Un usuario solo puede tener una excepción por fecha (UNIQUE usuario_id+fecha);
        volver a postear para la misma fecha reemplaza la excepción anterior.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fecha, tipo]
              properties:
                fecha: { type: string, format: date }
                tipo: { type: string, enum: [NO_DISPONIBLE, HORARIO_MODIFICADO] }
                horaInicio: { type: string, description: "Requerido si tipo=HORARIO_MODIFICADO" }
                horaFin: { type: string, description: "Requerido si tipo=HORARIO_MODIFICADO" }
                motivo: { type: string }
      responses:
        "201": { description: Excepción cargada (o reemplazada si ya existía una para esa fecha) }
        "400": { description: "horaInicio/horaFin faltantes para tipo=HORARIO_MODIFICADO, o presentes para tipo=NO_DISPONIBLE" }

  /api/availability/no-disponible-ahora:
    post:
      tags: [availability]
      summary: Marcarme como no disponible por el resto de hoy (Admin)
      description: |
        Atajo de un solo paso equivalente a cargar una excepción NO_DISPONIBLE para
        la fecha de hoy (RF-07.5) — útil para "llegué tarde" o "hoy no puedo estar".
      security: [{ bearerAuth: [] }]
      responses:
        "201": { description: Marcado como no disponible por hoy }

  # ── Endpoints agregados tras la revisión completa ────────────────────
  # (RF que el spec declaraba pero que no tenían implementación)

  /api/inventory/equipos/{equipoId}/incidencias:
    get:
      tags: [inventory]
      summary: Incidencias de un equipo
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: equipoId
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Incidencia' }

  /api/reporting/historico/{anio}/uso-docentes:
    get:
      tags: [reports]
      summary: Histórico de uso por docente de un año archivado (RF-06.4, Admin)
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: anio
          required: true
          schema: { type: integer }
      responses:
        "200": { description: OK }

  /api/reporting/incidencias/carros:
    get:
      tags: [reports]
      summary: Incidencias agregadas por carro (RF-06.3, Admin)
      description: |
        No depende del ciclo lectivo: Incidencia nunca se elimina (sobrevive
        al archivado, RF-02.4), así que se resuelve siempre en vivo.

        Este reporte agrupa POR CARRO, así que los equipos sueltos (015) no
        aparecen: no pertenecen a ninguno. Sus incidencias se ven en
        `/api/reporting/incidencias/equipos`.
      security: [{ bearerAuth: [] }]
      parameters:
        - in: query
          name: desde
          schema: { type: string, format: date }
        - in: query
          name: hasta
          schema: { type: string, format: date }
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        carroId: { type: string, format: uuid }
                        carroNombre: { type: string }
                        total: { type: integer }
                        abiertas: { type: integer }
                        graves: { type: integer }

  /api/inventory/categorias-de-falla:
    get:
      tags: [inventory]
      summary: Categorías de falla ya usadas (RF-03.5)
      description: |
        Las categorías distintas que ya se cargaron, ordenadas alfabéticamente
        y sin repetir por diferencia de mayúsculas.

        Alimenta la sugerencia del formulario de reporte. Es lo único que
        mantiene la categoría —que es texto libre a propósito— convergiendo
        sola, sin obligar a nadie a elegir de una lista cerrada.

        No requiere ser Admin: la usa la misma pantalla donde un docente
        reporta la falla.

        Es una colección propia y no `/incidencias/categorias`: no son
        incidencias, son el vocabulario con el que se las clasifica. Como
        hermana tampoco compite con `/incidencias/{id}` por el orden de
        registro de las rutas.
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { type: string }
                    example: [batería, pantalla, teclado]

  /api/reporting/inventario/estado:
    get:
      tags: [reports]
      summary: Estado del parque de equipos, por carro (RF-06.5, Admin)
      description: |
        Cuántos equipos hay disponibles, en mantenimiento y fuera de servicio,
        desglosado por carro.

        Describe el estado de HOY, así que no acepta rango de fechas ni
        depende del ciclo lectivo.

        Los dados de baja quedan afuera del total: ya no son parte del parque,
        y contarlos haría crecer el número para siempre. Los equipos sueltos
        (RF-03.16) van en una fila final sin `carroId` ni `carroNombre`.
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        carroId: { type: string, format: uuid, description: "Ausente en la fila de los equipos sueltos" }
                        carroNombre: { type: string }
                        disponibles: { type: integer }
                        enMantenimiento: { type: integer }
                        fueraDeServicio: { type: integer }
                        total: { type: integer, description: "Equipos no dados de baja de ese carro" }

  /api/reporting/inventario/fuera-de-circulacion:
    get:
      tags: [reports]
      summary: Equipos que hoy no se pueden reservar, con su falla (RF-06.6, Admin)
      description: |
        Un renglón por equipo en `EN_MANTENIMIENTO` o `FUERA_DE_SERVICIO`, con
        los datos de su ÚLTIMA incidencia. Es la lista con la que se pide un
        repuesto, frente a `/inventario/estado`, que da el número con el que se
        decide.

        Un equipo fuera de circulación SIN incidencias registradas aparece
        igual, con los campos de falla ausentes: alguien lo sacó de circulación
        y no anotó por qué, y eso es trabajo pendiente.

        Los dados de baja no se listan. Describe el estado de HOY: no acepta
        rango de fechas.
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        equipoId: { type: string, format: uuid }
                        etiqueta: { type: string, example: "PC 7" }
                        carroNombre: { type: string, description: "Ausente si es un equipo suelto" }
                        estado: { type: string, enum: [EN_MANTENIMIENTO, FUERA_DE_SERVICIO] }
                        categoria: { type: string, description: "Ausente si no se diagnosticó" }
                        ultimaFalla: { type: string, description: "Descripción de la incidencia más reciente" }
                        estadoIncidencia: { type: string, enum: [ABIERTA, EN_REPARACION, ENVIADA_A_SOPORTE, RESUELTA] }

  /api/reporting/incidencias/categorias:
    get:
      tags: [reports]
      summary: Incidencias agrupadas por tipo de falla (RF-06.7, Admin)
      description: |
        Responde "qué se rompe acá". Agrupa sin distinguir mayúsculas, porque
        la categoría es texto libre y "Batería" y "batería" son la misma falla
        escrita por dos personas.

        `equiposAlcanzados` es lo que distingue una máquina que se rompió diez
        veces de diez máquinas rotas: el mismo total con soluciones opuestas.

        Las incidencias sin clasificar no se descartan — van en una fila con
        `categoria` ausente. Cuántas fallas nadie pudo diagnosticar es parte de
        lo que el reporte tiene que decir.

        No depende del ciclo lectivo (RF-06.3), pero sí acepta rango: cuenta
        hechos fechados.
      security: [{ bearerAuth: [] }]
      parameters:
        - in: query
          name: desde
          schema: { type: string, format: date }
        - in: query
          name: hasta
          schema: { type: string, format: date }
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    description: De la falla más frecuente a la menos
                    items:
                      type: object
                      properties:
                        categoria: { type: string, description: "Ausente en la fila de las no clasificadas" }
                        total: { type: integer }
                        abiertas: { type: integer }
                        equiposAlcanzados: { type: integer, description: "Equipos distintos con esa falla" }

  /api/notifications/leer-todas:
    post:
      tags: [notifications]
      summary: Marcar como leídas todas las notificaciones propias (RF-05.7)
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  marcadas: { type: integer }

  /api/academic/mis-materias:
    get:
      tags: [academic]
      summary: Materias en las que el usuario autenticado puede reservar (RF-04.1)
      description: |
        Un docente ve solo las materias a las que está asignado; un Admin ve
        todas las no archivadas, porque RF-04.1 lo habilita a reservar para
        cualquiera de ellas sin estar asignado.

        Solo devuelve materias de ciclos y cursos NO archivados: "una materia
        de un ciclo ya cerrado no admite reservas nuevas aunque el registro
        se conserve".

        Existe como una sola consulta a propósito: sin esto, para saber "en
        qué materias puedo reservar" habría que recorrer ciclos → cursos →
        materias → docentes desde el cliente.
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        materiaId: { type: string, format: uuid }
                        materiaNombre: { type: string }
                        cursoId: { type: string, format: uuid }
                        cursoNombre: { type: string }
                        cicloId: { type: string, format: uuid }
                        cicloAnio: { type: integer }

  # ─────────────────────────────────────────
  # PERFIL: FOTO
  # ─────────────────────────────────────────
  /api/auth/mi-foto:
    put:
      tags: [auth]
      summary: Subir o reemplazar la foto de perfil propia
      description: >
        Multipart con el campo `foto`. El tipo se deduce de los primeros bytes
        del archivo, no de lo que declare el cliente: se aceptan PNG, JPEG y
        WEBP. Máximo 200 KB — la interfaz recorta y achica a 256×256 antes de
        subir.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                foto: { type: string, format: binary }
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  tipo: { type: string, example: image/webp }
                  actualizadaEn: { type: string, format: date-time }
        "400": { description: No es una imagen de un formato aceptado }
        "413": { description: Pasa el tamaño máximo }
    delete:
      tags: [auth]
      summary: Quitar la foto propia (vuelve a las iniciales)
      security: [{ bearerAuth: [] }]
      responses:
        "204": { description: Sin contenido }

  /api/auth/usuarios/{id}/foto:
    get:
      tags: [auth]
      summary: Ver la foto de una persona
      description: >
        La puede pedir cualquier usuario autenticado: las fotos aparecen al
        lado del nombre en pantallas compartidas. Responde con la imagen y un
        ETag; `Cache-Control: private` evita que un proxy compartido la guarde.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          content:
            image/*:
              schema: { type: string, format: binary }
        "404": { description: Esa persona no tiene foto }

  # ─────────────────────────────────────────
  # PEDIDOS PARA DICTAR UNA MATERIA
  # ─────────────────────────────────────────
  /api/academic/pedidos-de-materia:
    post:
      tags: [academic]
      summary: Pedir poder dictar una materia
      description: >
        Se elige una materia existente (`materiaId`) o se escribe una que
        todavía no está cargada (`materiaSolicitada` y `cursoSolicitado`),
        nunca las dos. El motivo es obligatorio: es lo que lee quien resuelve
        antes de hablar con la persona.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [motivo]
              properties:
                materiaId: { type: string, format: uuid }
                cursoSolicitado: { type: string }
                materiaSolicitada: { type: string }
                motivo: { type: string, maxLength: 1000 }
      responses:
        "201":
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PedidoDeMateria' }
        "400": { description: Falta el motivo, o la materia se indicó de las dos formas }
        "409": { description: Ya dicta esa materia, o ya tiene un pedido sin resolver }
    get:
      tags: [academic]
      summary: Listar pedidos (Admin)
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: pendientes, in: query, schema: { type: boolean }, description: Solo los que faltan resolver }
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/PedidoDeMateria' } }

  /api/academic/pedidos-de-materia/mios:
    get:
      tags: [academic]
      summary: Mis pedidos, con su estado y la respuesta
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/PedidoDeMateria' } }

  /api/academic/pedidos-de-materia/{id}/resolver:
    post:
      tags: [academic]
      summary: Aprobar o rechazar un pedido (Admin)
      description: >
        Aprobar asigna al docente y, si la materia no existía, la crea en el
        curso indicado (`cursoId`, obligatorio en ese caso). Sin `rol`, lo
        decide el sistema: titular si nadie dicta la materia, suplente si ya
        la dicta alguien. Rechazar exige respuesta.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [aprobar]
              properties:
                aprobar: { type: boolean }
                respuesta: { type: string, maxLength: 1000 }
                cursoId: { type: string, format: uuid }
                rol: { type: string, enum: [TITULAR, SUPLENTE] }
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PedidoDeMateria' }
        "400": { description: Falta el curso para crear la materia, o el rechazo no trae motivo }
        "409": { description: El pedido ya estaba resuelto }

  # ─────────────────────────────────────────
  # BUZÓN DE SUGERENCIAS
  # ─────────────────────────────────────────
  /api/sugerencias/:
    post:
      tags: [sugerencias]
      summary: Escribir al equipo de administración
      description: >
        `pantalla` y `version` las completa la interfaz, no la persona: sin
        ellas, un reporte obliga a preguntarle qué estaba haciendo.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tipo, texto]
              properties:
                tipo: { type: string, enum: [SUGERENCIA, PROBLEMA] }
                texto: { type: string, maxLength: 4000 }
                pantalla: { type: string, maxLength: 200 }
                version: { type: string }
      responses:
        "201":
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Sugerencia' }
    get:
      tags: [sugerencias]
      summary: Ver todo el buzón (Admin)
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: abiertas, in: query, schema: { type: boolean }, description: Solo lo que falta contestar }
        - { $ref: '#/components/parameters/page' }
        - { $ref: '#/components/parameters/pageSize' }
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/Sugerencia' } }
                  meta: { $ref: '#/components/schemas/PaginationMeta' }

  /api/sugerencias/mias:
    get:
      tags: [sugerencias]
      summary: Lo que escribí, con las respuestas
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/Sugerencia' } }

  /api/sugerencias/{id}/responder:
    post:
      tags: [sugerencias]
      summary: Contestar y cerrar un mensaje (Admin)
      description: Le llega un aviso a quien escribió.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [respuesta]
              properties:
                respuesta: { type: string, maxLength: 4000 }
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Sugerencia' }
        "409": { description: Ya estaba contestado }
