        "200": { description: Todas marcadas como leídas }

  # ══════════════════════════════
  # REPORTS
  # ══════════════════════════════
  /api/reporting/ciclos/{cicloId}/uso-pcs:
    get:
      tags: [reports]
      summary: Reporte de uso por PC (Admin)
      security: [{ bearerAuth: [] }]
      parameters:
        - in: query
          name: desde
          required: true
          schema: { type: string, format: date }
        - in: query
          name: hasta
          required: true
          schema: { type: string, format: date }
        - in: query
          name: carroId
          schema: { type: string, format: uuid }
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        pcId: { type: string, format: uuid }
                        identificador: { type: integer }
                        carroNombre: { type: string }
                        minutosReservados: { type: integer }
                        cantidadReservas: { type: integer }

  /api/reporting/ciclos/{cicloId}/uso-docentes:
    get:
      tags: [reports]
      summary: Reporte de uso por docente (Admin)
      security: [{ bearerAuth: [] }]
      parameters:
        - in: query
          name: anioMes
          required: true
          schema: { type: string, example: "2025-08" }
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        usuarioId: { type: string, format: uuid }
                        nombreDocente: { type: string }
                        cantidadReservas: { type: integer }
                        minutosTotales: { type: integer }

  /api/reporting/historico/{anio}/uso-pcs:
    get:
      tags: [reports]
      summary: Estadísticas de un ciclo lectivo ya archivado (Admin)
      description: |
        Lee de historico_uso_pc / historico_uso_docente — el único origen de datos
        disponible para años archivados, ya que sus ReservaGrupo/Reserva se
        eliminaron físicamente al archivar (ver RF-02.4).
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: anio
          required: true
          schema: { type: integer, example: 2025 }
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  usoPorPc:
                    type: array
                    items:
                      type: object
                      properties:
                        pcId: { type: string, format: uuid }
                        identificadorSnapshot: { type: integer }
                        carroNombreSnapshot: { type: string }
                        minutosReservados: { type: integer }
                        cantidadReservas: { type: integer }
                  usoPorDocente:
                    type: array
                    items:
                      type: object
                      properties:
                        usuarioId: { type: string, format: uuid, nullable: true }
                        nombreDocenteSnapshot: { type: string }
                        cantidadReservas: { type: integer }
                        minutosTotales: { type: integer }
        "404": { description: No hay estadísticas archivadas para ese año }

  /api/reporting/incidencias/pcs:
    get:
      tags: [reports]
      summary: Reporte de incidencias por PC/carro (Admin)
      security: [{ bearerAuth: [] }]
      parameters:
        - in: query
          name: desde
          schema: { type: string, format: date }
        - in: query
          name: hasta
          schema: { type: string, format: date }
        - in: query
          name: carroId
          schema: { type: string, format: uuid }
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/Incidencia' } }

  # ══════════════════════════════
  # AVAILABILITY
  # ══════════════════════════════
  /api/availability/admins:
    get:
      tags: [availability]
      summary: Ver disponibilidad de todos los Admins (cualquier usuario autenticado)
      description: |
        Puramente informativo (RF-07.6) — no afecta ninguna otra funcionalidad.
        disponibleAhora se calcula en el momento contra el horario semanal y la
        excepción del día de hoy, si existe (la excepción siempre tiene prioridad).
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/AdminDisponibilidad' } }

  /api/availability/mi-horario:
    get:
      tags: [availability]
      summary: Ver mi propio horario semanal (Admin)
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/BloqueHorarioAdmin' } }
    post:
      tags: [availability]
      summary: Agregar un bloque a mi horario semanal (Admin)
      description: Aplica de inmediato para todas las semanas futuras (RF-07.3) — no requiere ninguna acción de "propagar".
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [diaSemana, horaInicio, horaFin]
              properties:
                diaSemana: { type: string, enum: [LUNES, MARTES, MIERCOLES, JUEVES, VIERNES] }
                horaInicio: { type: string, example: "08:00" }
                horaFin: { type: string, example: "12:00" }
      responses:
        "201": { description: Bloque agregado }

  /api/availability/mi-horario/{id}:
    patch:
      tags: [availability]
      summary: Editar un bloque de mi horario semanal (Admin)
      description: El cambio aplica desde ahora para todas las semanas futuras — no versiona el pasado, porque no hay nada materializado que preservar.
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                diaSemana: { type: string, enum: [LUNES, MARTES, MIERCOLES, JUEVES, VIERNES] }
                horaInicio: { type: string }
                horaFin: { type: string }
      responses:
        "200": { description: Bloque actualizado }
    delete:
      tags: [availability]
      summary: Eliminar un bloque de mi horario semanal (Admin)
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200": { description: Bloque eliminado }

  /api/availability/mi-excepcion:
    post:
      tags: [availability]
      summary: Cargar una excepción puntual (horario distinto o ausencia) para una fecha (Admin)
      description: |
        No afecta el patrón semanal general — solo esa fecha puntual (RF-07.4).
        Un usuario solo puede tener una excepción por fecha (UNIQUE usuario_id+fecha);
        volver a postear para la misma fecha reemplaza la excepción anterior.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fecha, tipo]
              properties:
                fecha: { type: string, format: date }
                tipo: { type: string, enum: [NO_DISPONIBLE, HORARIO_MODIFICADO] }
                horaInicio: { type: string, description: "Requerido si tipo=HORARIO_MODIFICADO" }
                horaFin: { type: string, description: "Requerido si tipo=HORARIO_MODIFICADO" }
                motivo: { type: string }
      responses:
        "201": { description: Excepción cargada (o reemplazada si ya existía una para esa fecha) }
        "400": { description: "horaInicio/horaFin faltantes para tipo=HORARIO_MODIFICADO, o presentes para tipo=NO_DISPONIBLE" }

  /api/availability/no-disponible-ahora:
    post:
      tags: [availability]
      summary: Marcarme como no disponible por el resto de hoy (Admin)
      description: |
        Atajo de un solo paso equivalente a cargar una excepción NO_DISPONIBLE para
        la fecha de hoy (RF-07.5) — útil para "llegué tarde" o "hoy no puedo estar".
      security: [{ bearerAuth: [] }]
      responses:
        "201": { description: Marcado como no disponible por hoy }

  # ── Endpoints agregados tras la revisión completa ────────────────────
  # (RF que el spec declaraba pero que no tenían implementación)

  /api/inventory/carros/{carroId}/pcs:
