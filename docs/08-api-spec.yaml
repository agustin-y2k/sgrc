      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Incidencia' }

  /api/reporting/historico/{anio}/uso-docentes:
    get:
      tags: [reports]
      summary: Histórico de uso por docente de un año archivado (RF-06.4, Admin)
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: anio
          required: true
          schema: { type: integer }
      responses:
        "200": { description: OK }

  /api/reporting/incidencias/carros:
    get:
      tags: [reports]
      summary: Incidencias agregadas por carro (RF-06.3, Admin)
      description: |
        No depende del ciclo lectivo: Incidencia nunca se elimina (sobrevive
        al archivado, RF-02.4), así que se resuelve siempre en vivo.
      security: [{ bearerAuth: [] }]
      parameters:
        - in: query
